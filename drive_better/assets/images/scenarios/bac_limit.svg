<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#1a1a2a"/>
  <!-- Wine glass -->
  <g transform="translate(80,20)">
    <!-- Glass bowl -->
    <path d="M20,10 Q5,50 15,80 Q35,100 55,80 Q65,50 50,10 Z" fill="#cc2244" opacity="0.85"/>
    <!-- Glass rim -->
    <ellipse cx="35" cy="10" rx="16" ry="5" fill="#dd3355" opacity="0.7"/>
    <!-- Wine surface -->
    <ellipse cx="35" cy="30" rx="14" ry="4" fill="#ff4466" opacity="0.4"/>
    <!-- Stem -->
    <line x1="35" y1="80" x2="35" y2="115" stroke="#aabbcc" stroke-width="4" stroke-linecap="round"/>
    <!-- Base -->
    <ellipse cx="35" cy="118" rx="22" ry="6" fill="#aabbcc"/>
  </g>
  <!-- Red X over glass -->
  <g transform="translate(65,10)" opacity="0.92">
    <line x1="0" y1="0" x2="70" y2="130" stroke="#ff2222" stroke-width="8" stroke-linecap="round"/>
    <line x1="70" y1="0" x2="0" y2="130" stroke="#ff2222" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- Circle prohibition -->
  <circle cx="115" cy="85" r="62" fill="none" stroke="#ff2222" stroke-width="5"/>
  <!-- 0.5 g/l label -->
  <rect x="168" y="55" width="108" height="70" rx="12" fill="#cc2244"/>
  <text x="222" y="98" text-anchor="middle" font-family="Arial" font-size="26" fill="white" font-weight="bold">0,5 g/l</text>
  <!-- Label -->
  <text x="150" y="178" text-anchor="middle" font-family="Arial" font-size="13" fill="#ffaaaa">Limite d'alcoolémie</text>
  <!-- Subtext -->
  <text x="150" y="196" text-anchor="middle" font-family="Arial" font-size="10" fill="#aa7788">0,2 g/l pour conducteurs novices</text>
</svg>
