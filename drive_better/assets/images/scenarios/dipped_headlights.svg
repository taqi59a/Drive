<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Night background -->
  <rect x="0" y="0" width="300" height="200" fill="#1A237E"/>
  <!-- Car front view -->
  <!-- Body -->
  <rect x="60" y="80" width="180" height="90" rx="12" fill="#37474F" stroke="#263238" stroke-width="2"/>
  <!-- Roof -->
  <path d="M90,80 Q100,45 150,42 Q200,45 210,80 Z" fill="#455A64" stroke="#263238" stroke-width="2"/>
  <!-- Windscreen -->
  <path d="M98,78 Q105,52 150,50 Q195,52 202,78 Z" fill="#B3E5FC" opacity="0.6"/>
  <!-- Headlights -->
  <ellipse cx="95" cy="118" rx="22" ry="14" fill="#FFF9C4" stroke="#F9A825" stroke-width="2"/>
  <ellipse cx="205" cy="118" rx="22" ry="14" fill="#FFF9C4" stroke="#F9A825" stroke-width="2"/>
  <!-- Dipped beam pattern (left beam angled down-left) -->
  <path d="M73 118 L15 160 L30 170 L82 130" fill="#FFF9C4" opacity="0.25"/>
  <path d="M73 118 L10 155" stroke="#FFF59D" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M79 120 L22 158" stroke="#FFF59D" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M85 122 L35 162" stroke="#FFF59D" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Right beam angled down-right -->
  <path d="M227 118 L285 160 L270 170 L218 130" fill="#FFF9C4" opacity="0.25"/>
  <path d="M227 118 L290 155" stroke="#FFF59D" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M221 120 L278 158" stroke="#FFF59D" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M215 122 L265 162" stroke="#FFF59D" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Grille -->
  <rect x="120" y="148" width="60" height="14" rx="4" fill="#263238" stroke="#37474F" stroke-width="1.5"/>
  <!-- Dipped headlights label -->
  <text x="150" y="195" text-anchor="middle" font-family="Arial" font-size="11" fill="#B3E5FC">Dipped Headlights</text>
</svg>
