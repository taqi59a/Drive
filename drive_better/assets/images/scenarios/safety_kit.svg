<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="300" height="200" fill="#FAFAFA"/>
  <!-- Warning triangle -->
  <g transform="translate(50,100)">
    <polygon points="0,-55 -48,38 48,38" fill="#FF6F00" stroke="#E65100" stroke-width="3"/>
    <polygon points="0,-38 -33,28 33,28" fill="#FFF9C4"/>
    <line x1="0" y1="-22" x2="0" y2="10" stroke="#E65100" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="20" r="4" fill="#E65100"/>
    <text x="0" y="58" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Warning</text>
  </g>
  <!-- Reflective vest -->
  <g transform="translate(150,95)">
    <!-- Vest shape -->
    <path d="M-28,-40 L-38,35 L38,35 L28,-40 L12,-40 L0,-20 L-12,-40 Z" fill="#FFEB3B" stroke="#F9A825" stroke-width="2"/>
    <!-- Reflective strips -->
    <line x1="-35" y1="5" x2="35" y2="5" stroke="white" stroke-width="5"/>
    <line x1="-35" y1="18" x2="35" y2="18" stroke="white" stroke-width="5"/>
    <text x="0" y="55" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Hi-Vis Vest</text>
  </g>
  <!-- First aid box -->
  <g transform="translate(250,100)">
    <rect x="-30" y="-35" width="60" height="55" rx="6" fill="white" stroke="#E53935" stroke-width="3"/>
    <!-- Red cross -->
    <rect x="-8" y="-22" width="16" height="30" rx="2" fill="#E53935"/>
    <rect x="-18" y="-12" width="36" height="12" rx="2" fill="#E53935"/>
    <text x="0" y="36" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">First Aid</text>
  </g>
</svg>
