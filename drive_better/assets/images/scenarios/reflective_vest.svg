<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#e8e8e8"/>
  <!-- Car in background -->
  <g transform="translate(160,110)">
    <rect x="0" y="-22" width="110" height="38" rx="5" fill="#2255aa"/>
    <rect x="12" y="-32" width="70" height="20" rx="4" fill="#3377cc"/>
    <circle cx="18" cy="18" r="9" fill="#222"/>
    <circle cx="90" cy="18" r="9" fill="#222"/>
    <rect x="-5" y="-12" width="8" height="6" fill="#ff4444"/>
  </g>
  <!-- Human figure with reflective vest -->
  <!-- Head -->
  <circle cx="110" cy="62" r="16" fill="#f5c88a"/>
  <!-- Face -->
  <circle cx="105" cy="60" r="2.5" fill="#333"/>
  <circle cx="115" cy="60" r="2.5" fill="#333"/>
  <path d="M105,68 Q110,72 115,68" stroke="#333" stroke-width="1.5" fill="none"/>
  <!-- Reflective vest body -->
  <path d="M88,78 L88,140 L132,140 L132,78 Q121,72 110,78 Q99,72 88,78 Z" fill="#FF8C00"/>
  <!-- Reflective stripes -->
  <rect x="88" y="100" width="44" height="6" rx="2" fill="#FFD700" opacity="0.9"/>
  <rect x="88" y="116" width="44" height="6" rx="2" fill="#FFD700" opacity="0.9"/>
  <!-- Arms -->
  <line x1="88" y1="90" x2="68" y2="118" stroke="#FF8C00" stroke-width="12" stroke-linecap="round"/>
  <line x1="132" y1="90" x2="152" y2="118" stroke="#FF8C00" stroke-width="12" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="100" y1="140" x2="94" y2="175" stroke="#333" stroke-width="10" stroke-linecap="round"/>
  <line x1="120" y1="140" x2="126" y2="175" stroke="#333" stroke-width="10" stroke-linecap="round"/>
  <text x="150" y="196" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">Gilet réfléchissant</text>
</svg>
