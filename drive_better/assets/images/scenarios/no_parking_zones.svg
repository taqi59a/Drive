<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#f8f9fa"/>
  <!-- Title -->
  <text x="150" y="20" text-anchor="middle" font-family="Arial" font-size="12" fill="#2c3e50" font-weight="bold">NO PARKING ZONES</text>

  <!-- === FIRE HYDRANT === -->
  <!-- Hydrant -->
  <rect x="28" y="110" width="14" height="20" rx="3" fill="#e74c3c"/>
  <rect x="24" y="107" width="22" height="8" rx="2" fill="#c0392b"/>
  <rect x="26" y="125" width="18" height="6" rx="2" fill="#c0392b"/>
  <rect x="18" y="114" width="10" height="7" rx="2" fill="#c0392b"/>
  <rect x="42" y="114" width="10" height="7" rx="2" fill="#c0392b"/>
  <!-- No parking circle -->
  <circle cx="35" cy="75" r="22" fill="white" stroke="#e74c3c" stroke-width="4"/>
  <text x="35" y="80" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1a5276">P</text>
  <line x1="17" y1="57" x2="53" y2="93" stroke="#e74c3c" stroke-width="4"/>
  <line x1="18" y1="97" x2="35" y2="140" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="35" y="155" text-anchor="middle" font-family="Arial" font-size="9" fill="#e74c3c">Fire Hydrant</text>

  <!-- === ROAD JUNCTION === -->
  <!-- Junction roads -->
  <rect x="125" y="100" width="50" height="70" fill="#888"/>
  <rect x="95" y="120" width="110" height="30" fill="#888"/>
  <line x1="125" y1="135" x2="95" y2="135" stroke="white" stroke-width="1.5" stroke-dasharray="6,5"/>
  <line x1="175" y1="135" x2="205" y2="135" stroke="white" stroke-width="1.5" stroke-dasharray="6,5"/>
  <line x1="150" y1="120" x2="150" y2="100" stroke="white" stroke-width="1.5" stroke-dasharray="6,5"/>
  <!-- No parking circle -->
  <circle cx="150" cy="65" r="22" fill="white" stroke="#e74c3c" stroke-width="4"/>
  <text x="150" y="70" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1a5276">P</text>
  <line x1="132" y1="47" x2="168" y2="83" stroke="#e74c3c" stroke-width="4"/>
  <line x1="150" y1="87" x2="150" y2="100" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="150" y="178" text-anchor="middle" font-family="Arial" font-size="9" fill="#e74c3c">Road Junction</text>

  <!-- === BUS STOP === -->
  <!-- Bus stop pole -->
  <rect x="262" y="100" width="5" height="70" fill="#1a5276"/>
  <!-- Bus stop sign -->
  <rect x="248" y="90" width="32" height="22" rx="3" fill="#1a5276"/>
  <text x="264" y="105" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">BUS</text>
  <!-- No parking circle -->
  <circle cx="264" cy="65" r="22" fill="white" stroke="#e74c3c" stroke-width="4"/>
  <text x="264" y="70" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1a5276">P</text>
  <line x1="246" y1="47" x2="282" y2="83" stroke="#e74c3c" stroke-width="4"/>
  <line x1="264" y1="87" x2="264" y2="90" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="264" y="178" text-anchor="middle" font-family="Arial" font-size="9" fill="#e74c3c">Bus Stop</text>
</svg>