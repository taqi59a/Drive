<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#f0f4f8"/>
  <text x="150" y="15" text-anchor="middle" font-family="Arial" font-size="11" fill="#2c3e50" font-weight="bold">MOTORWAY WORKS — MERGE RIGHT</text>
  <!-- Three lanes approaching, merging to two -->
  <!-- Lane boundaries (top-down perspective) -->
  <!-- Left lane -->
  <polygon points="0,30 80,30 160,80 0,80" fill="#777"/>
  <!-- Middle lane -->
  <polygon points="80,30 160,30 160,80 80,80" fill="#777"/>
  <!-- Right lane -->
  <polygon points="160,30 300,30 300,80 160,80" fill="#777"/>
  <!-- After merge — two lanes only -->
  <rect x="0" y="80" width="300" height="100" fill="#777"/>
  <!-- Lane lines before merge -->
  <line x1="80" y1="30" x2="160" y2="80" stroke="white" stroke-width="2" stroke-dasharray="8,6"/>
  <line x1="160" y1="30" x2="160" y2="80" stroke="white" stroke-width="2" stroke-dasharray="8,6"/>
  <!-- Lane lines after merge -->
  <line x1="0" y1="130" x2="300" y2="130" stroke="white" stroke-width="2" stroke-dasharray="15,10"/>
  <line x1="0" y1="178" x2="300" y2="178" stroke="white" stroke-width="2"/>
  <line x1="0" y1="82" x2="300" y2="82" stroke="white" stroke-width="2"/>
  <!-- Orange works zone overlay on left lane -->
  <polygon points="0,30 80,30 160,80 0,80" fill="#e67e22" opacity="0.35"/>
  <!-- Cones marking left lane closure -->
  <g>
    <polygon points="20,75 25,75 24,58 21,58" fill="#e67e22"/>
    <rect x="19" y="58" width="7" height="2" fill="white"/>
    <rect x="19" y="62" width="7" height="2" fill="#e67e22"/>
  </g>
  <g>
    <polygon points="50,72 55,72 54,55 51,55" fill="#e67e22"/>
    <rect x="49" y="55" width="7" height="2" fill="white"/>
    <rect x="49" y="59" width="7" height="2" fill="#e67e22"/>
  </g>
  <g>
    <polygon points="80,68 85,68 84,51 81,51" fill="#e67e22"/>
    <rect x="79" y="51" width="7" height="2" fill="white"/>
    <rect x="79" y="55" width="7" height="2" fill="#e67e22"/>
  </g>
  <!-- Merge arrow (left car moves right) -->
  <path d="M40,100 Q80,95 115,110" fill="none" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/>
  <polygon points="110,104 120,112 108,117" fill="#e74c3c"/>
  <!-- Cars -->
  <!-- Left lane car (merging) -->
  <rect x="18" y="88" width="38" height="20" rx="4" fill="#e74c3c"/>
  <rect x="23" y="81" width="26" height="13" rx="3" fill="#e74c3c"/>
  <circle cx="26" cy="110" r="6" fill="#222"/>
  <circle cx="50" cy="110" r="6" fill="#222"/>
  <!-- Right lane car -->
  <rect x="185" y="88" width="38" height="20" rx="4" fill="#3a7bd5"/>
  <rect x="190" y="81" width="26" height="13" rx="3" fill="#3a7bd5"/>
  <circle cx="193" cy="110" r="6" fill="#222"/>
  <circle cx="217" cy="110" r="6" fill="#222"/>
  <!-- Arrow sign -->
  <rect x="220" y="30" width="55" height="35" rx="4" fill="#f39c12" stroke="#2c3e50" stroke-width="2"/>
  <polygon points="270,47 255,35 255,42 230,42 230,52 255,52 255,59" fill="#2c3e50"/>
  <text x="150" y="197" text-anchor="middle" font-family="Arial" font-size="10" fill="#e67e22" font-weight="bold">ORANGE ZONE — LANES MERGING</text>
</svg>