<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Smartphone body -->
  <rect x="110" y="30" width="80" height="140" rx="12" ry="12" fill="#444" stroke="#222" stroke-width="3"/>
  <rect x="118" y="44" width="64" height="100" rx="4" ry="4" fill="#87CEEB"/>
  <!-- Home button -->
  <circle cx="150" cy="158" r="7" fill="#666" stroke="#333" stroke-width="1.5"/>
  <!-- Speaker -->
  <rect x="135" y="36" width="30" height="4" rx="2" fill="#666"/>
  <!-- Red X overlay -->
  <line x1="90" y1="20" x2="210" y2="180" stroke="#E53935" stroke-width="14" stroke-linecap="round"/>
  <line x1="210" y1="20" x2="90" y2="180" stroke="#E53935" stroke-width="14" stroke-linecap="round"/>
</svg>
