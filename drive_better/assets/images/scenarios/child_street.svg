<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#4a7c59"/>
  <!-- Road (perspective view) -->
  <polygon points="80,200 220,200 260,80 40,80" fill="#777"/>
  <!-- Road markings perspective -->
  <line x1="150" y1="200" x2="150" y2="80" stroke="white" stroke-width="2" stroke-dasharray="15,10" opacity="0.6"/>
  <!-- Sidewalk left -->
  <polygon points="0,200 80,200 40,80 0,80" fill="#aaa"/>
  <!-- Sidewalk right -->
  <polygon points="220,200 300,200 300,80 260,80" fill="#aaa"/>
  <!-- Parked car left -->
  <g transform="translate(5,120)">
    <rect x="0" y="0" width="55" height="32" rx="5" fill="#888"/>
    <rect x="7" y="-9" width="36" height="18" rx="4" fill="#999"/>
    <circle cx="10" cy="34" r="7" fill="#333"/>
    <circle cx="44" cy="34" r="7" fill="#333"/>
  </g>
  <!-- Parked car right -->
  <g transform="translate(238,125)">
    <rect x="0" y="0" width="55" height="32" rx="5" fill="#666"/>
    <rect x="7" y="-9" width="36" height="18" rx="4" fill="#777"/>
    <circle cx="10" cy="34" r="7" fill="#333"/>
    <circle cx="44" cy="34" r="7" fill="#333"/>
  </g>
  <!-- Child running out from behind right parked car -->
  <g transform="translate(228,108)">
    <!-- Head -->
    <circle cx="0" cy="0" r="9" fill="#f5c88a"/>
    <!-- Body -->
    <rect x="-5" y="9" width="10" height="14" rx="3" fill="#ee4444"/>
    <!-- Running legs -->
    <line x1="-3" y1="23" x2="-10" y2="36" stroke="#333" stroke-width="4" stroke-linecap="round"/>
    <line x1="3" y1="23" x2="8" y2="34" stroke="#333" stroke-width="4" stroke-linecap="round"/>
    <!-- Arms -->
    <line x1="-5" y1="14" x2="-14" y2="22" stroke="#f5c88a" stroke-width="3" stroke-linecap="round"/>
    <line x1="5" y1="14" x2="12" y2="20" stroke="#f5c88a" stroke-width="3" stroke-linecap="round"/>
    <!-- Motion arrow -->
    <path d="M14,18 L26,18" stroke="#FFD700" stroke-width="2.5" fill="none" marker-end="url(#chA)"/>
  </g>
  <defs>
    <marker id="chA" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#FFD700"/>
    </marker>
  </defs>
  <!-- Danger exclamation -->
  <circle cx="210" cy="95" r="14" fill="#FFD700" stroke="#cc8800" stroke-width="2"/>
  <rect x="207" y="84" width="6" height="12" rx="2" fill="#333"/>
  <circle cx="210" cy="103" r="3" fill="#333"/>
  <text x="150" y="195" text-anchor="middle" font-family="Arial" font-size="11" fill="white">Enfant sur la chaussée</text>
</svg>
