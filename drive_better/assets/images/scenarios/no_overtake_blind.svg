<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#f0f4f8"/>
  <!-- Curved road -->
  <path d="M0,160 Q150,80 300,140" fill="none" stroke="#777" stroke-width="60"/>
  <!-- Road surface -->
  <path d="M0,160 Q150,80 300,140" fill="none" stroke="#888" stroke-width="56"/>
  <!-- Solid white center line (no overtaking) -->
  <path d="M0,160 Q150,80 300,140" fill="none" stroke="white" stroke-width="3"/>
  <!-- Left edge line -->
  <path d="M0,185 Q150,105 300,165" fill="none" stroke="white" stroke-width="2" stroke-dasharray="12,8"/>
  <!-- Right edge line -->
  <path d="M0,135 Q150,55 300,115" fill="none" stroke="white" stroke-width="2" stroke-dasharray="12,8"/>
  <!-- No overtaking sign -->
  <circle cx="220" cy="55" r="38" fill="white" stroke="#e74c3c" stroke-width="4"/>
  <!-- Two car silhouettes side by side -->
  <rect x="198" y="38" width="22" height="14" rx="3" fill="#555"/>
  <rect x="201" y="32" width="15" height="10" rx="2" fill="#555"/>
  <rect x="222" y="38" width="22" height="14" rx="3" fill="#e74c3c"/>
  <rect x="225" y="32" width="15" height="10" rx="2" fill="#e74c3c"/>
  <!-- Diagonal ban line -->
  <line x1="188" y1="25" x2="252" y2="85" stroke="#e74c3c" stroke-width="5"/>
  <text x="150" y="192" text-anchor="middle" font-family="Arial" font-size="11" fill="#2c3e50" font-weight="bold">NO OVERTAKING ON BLIND BEND</text>
</svg>