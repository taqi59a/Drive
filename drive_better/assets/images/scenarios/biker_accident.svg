<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#f0f4f8"/>
  <text x="150" y="15" text-anchor="middle" font-family="Arial" font-size="11" fill="#2c3e50" font-weight="bold">MOTORCYCLE ACCIDENT — DO NOT REMOVE HELMET</text>
  <!-- Ground -->
  <line x1="0" y1="155" x2="300" y2="155" stroke="#999" stroke-width="2"/>
  <!-- Fallen motorcycle -->
  <!-- Frame (tilted) -->
  <g transform="rotate(-35, 110, 130)">
    <rect x="75" y="120" width="70" height="12" rx="4" fill="#555"/>
    <!-- Engine block -->
    <rect x="92" y="112" width="30" height="20" rx="3" fill="#444"/>
    <!-- Exhaust -->
    <path d="M145,126 Q158,128 160,135" fill="none" stroke="#666" stroke-width="4" stroke-linecap="round"/>
    <!-- Handlebars -->
    <line x1="78" y1="112" x2="68" y2="104" stroke="#555" stroke-width="4" stroke-linecap="round"/>
    <line x1="68" y1="104" x2="58" y2="106" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Front wheel -->
  <circle cx="72" cy="148" r="18" fill="none" stroke="#333" stroke-width="5"/>
  <circle cx="72" cy="148" r="5" fill="#555"/>
  <!-- Rear wheel -->
  <circle cx="158" cy="142" r="18" fill="none" stroke="#333" stroke-width="5"/>
  <circle cx="158" cy="142" r="5" fill="#555"/>
  <!-- Helmet on ground (detached) -->
  <ellipse cx="230" cy="148" rx="26" ry="20" fill="#e74c3c"/>
  <ellipse cx="230" cy="148" rx="22" ry="10" fill="#c0392b" opacity="0.5"/>
  <!-- Visor -->
  <path d="M210,140 Q230,133 250,140" fill="none" stroke="#a8d8f0" stroke-width="4" stroke-linecap="round"/>
  <!-- Red X over helmet removal action -->
  <circle cx="230" cy="148" r="30" fill="none" stroke="#e74c3c" stroke-width="4"/>
  <line x1="209" y1="127" x2="251" y2="169" stroke="#e74c3c" stroke-width="4"/>
  <!-- Hand reaching toward helmet with X -->
  <path d="M195,120 Q210,128 212,138" fill="none" stroke="#f5cba7" stroke-width="6" stroke-linecap="round"/>
  <!-- Rider silhouette on ground -->
  <circle cx="110" cy="155" r="10" fill="#666"/>
  <line x1="110" y1="165" x2="110" y2="185" stroke="#666" stroke-width="8" stroke-linecap="round"/>
  <line x1="100" y1="170" x2="120" y2="170" stroke="#666" stroke-width="6" stroke-linecap="round"/>
  <line x1="110" y1="185" x2="100" y2="198" stroke="#666" stroke-width="6" stroke-linecap="round"/>
  <line x1="110" y1="185" x2="120" y2="198" stroke="#666" stroke-width="6" stroke-linecap="round"/>
  <text x="230" y="188" text-anchor="middle" font-family="Arial" font-size="9" fill="#e74c3c" font-weight="bold">DO NOT REMOVE</text>
</svg>