<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#4a7c59"/>
  <!-- Curved road top-down -->
  <!-- Road outer edge -->
  <path d="M20,180 Q20,80 160,40 Q220,25 280,30" stroke="#888" stroke-width="50" fill="none" stroke-linecap="round"/>
  <!-- Road surface -->
  <path d="M20,180 Q20,80 160,40 Q220,25 280,30" stroke="#777" stroke-width="44" fill="none" stroke-linecap="round"/>
  <!-- Road center dashes -->
  <path d="M20,180 Q20,80 160,40 Q220,25 280,30" stroke="white" stroke-width="2" fill="none" stroke-dasharray="16,10" stroke-linecap="round"/>
  <!-- Vegetation blocking view -->
  <ellipse cx="175" cy="95" rx="45" ry="40" fill="#2d6a2d" opacity="0.95"/>
  <ellipse cx="155" cy="80" rx="35" ry="30" fill="#388038" opacity="0.9"/>
  <ellipse cx="195" cy="110" rx="38" ry="32" fill="#2d6a2d" opacity="0.9"/>
  <!-- Car at bend -->
  <g transform="translate(32,148) rotate(-70)">
    <rect x="-18" y="-10" width="36" height="20" rx="4" fill="#2255aa"/>
    <rect x="-12" y="-16" width="24" height="12" rx="3" fill="#3377cc"/>
    <circle cx="-11" cy="12" r="5" fill="#222"/>
    <circle cx="11" cy="12" r="5" fill="#222"/>
    <rect x="15" y="-5" width="5" height="4" fill="#ffffaa"/>
  </g>
  <!-- Question mark - unknown ahead -->
  <circle cx="240" cy="90" r="28" fill="#FFD700" stroke="#cc8800" stroke-width="2.5"/>
  <text x="240" y="100" text-anchor="middle" font-family="Arial" font-size="30" fill="#333" font-weight="bold">?</text>
  <text x="150" y="192" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Virage sans visibilité</text>
</svg>
