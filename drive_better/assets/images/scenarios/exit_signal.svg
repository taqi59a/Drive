<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Road -->
  <rect x="0" y="0" width="300" height="200" fill="#bbb"/>
  <rect x="30" y="0" width="240" height="200" fill="#555"/>
  <line x1="150" y1="0" x2="150" y2="200" stroke="white" stroke-width="2" stroke-dasharray="16,10"/>
  <!-- Overhead gantry posts -->
  <rect x="35" y="60" width="8" height="110" fill="#78909C"/>
  <rect x="257" y="60" width="8" height="110" fill="#78909C"/>
  <!-- Gantry beam -->
  <rect x="35" y="55" width="230" height="18" rx="4" fill="#78909C" stroke="#546E7A" stroke-width="2"/>
  <!-- Sign on gantry -->
  <rect x="90" y="20" width="120" height="44" rx="5" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
  <text x="150" y="38" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">300 m</text>
  <text x="150" y="54" text-anchor="middle" font-family="Arial" font-size="10" fill="white">SORTIE ➜</text>
  <!-- Car in left lane with right indicator -->
  <g transform="translate(95,140)">
    <rect x="-20" y="-28" width="40" height="56" rx="8" fill="#2196F3" stroke="#1565C0" stroke-width="2"/>
    <rect x="-14" y="-20" width="28" height="16" rx="3" fill="#B3E5FC"/>
    <rect x="-14" y="12" width="28" height="14" rx="3" fill="#B3E5FC"/>
    <rect x="-25" y="-16" width="7" height="12" rx="2" fill="#222"/>
    <rect x="18" y="-16" width="7" height="12" rx="2" fill="#222"/>
    <rect x="-25" y="14" width="7" height="12" rx="2" fill="#222"/>
    <rect x="18" y="14" width="7" height="12" rx="2" fill="#222"/>
    <!-- Right indicator orange -->
    <rect x="18" y="-16" width="7" height="12" rx="2" fill="#FF6F00"/>
    <rect x="18" y="14" width="7" height="12" rx="2" fill="#FF6F00"/>
  </g>
  <!-- Right indicator arrow -->
  <path d="M118 120 Q135 110 148 115" stroke="#FF6F00" stroke-width="3" fill="none" marker-end="url(#ia)" stroke-linecap="round"/>
  <defs>
    <marker id="ia" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 Z" fill="#FF6F00"/>
    </marker>
  </defs>
</svg>
