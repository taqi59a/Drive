<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Road -->
  <rect x="0" y="0" width="300" height="200" fill="#bbb"/>
  <rect x="20" y="0" width="200" height="200" fill="#555"/>
  <!-- Lane divider -->
  <line x1="120" y1="0" x2="120" y2="200" stroke="white" stroke-width="2" stroke-dasharray="16,10"/>
  <!-- Exit ramp -->
  <path d="M220 0 Q240 80 280 120 L300 120 L300 0 Z" fill="#666"/>
  <path d="M220 0 Q240 80 280 120" stroke="white" stroke-width="2" stroke-dasharray="10,7" fill="none"/>
  <!-- Exit sign -->
  <rect x="195" y="15" width="90" height="36" rx="4" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
  <text x="240" y="30" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="white">SORTIE</text>
  <text x="240" y="44" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="white">EXIT ➜</text>
  <!-- Car with right indicator -->
  <g transform="translate(165,130)">
    <rect x="-20" y="-28" width="40" height="56" rx="8" fill="#2196F3" stroke="#1565C0" stroke-width="2"/>
    <rect x="-14" y="-20" width="28" height="16" rx="3" fill="#B3E5FC"/>
    <rect x="-14" y="12" width="28" height="14" rx="3" fill="#B3E5FC"/>
    <rect x="-25" y="-16" width="7" height="12" rx="2" fill="#222"/>
    <rect x="18" y="-16" width="7" height="12" rx="2" fill="#222"/>
    <rect x="-25" y="14" width="7" height="12" rx="2" fill="#222"/>
    <rect x="18" y="14" width="7" height="12" rx="2" fill="#222"/>
    <!-- Right indicator (orange) -->
    <rect x="18" y="-16" width="7" height="12" rx="2" fill="#FF6F00"/>
    <rect x="18" y="14" width="7" height="12" rx="2" fill="#FF6F00"/>
  </g>
  <!-- Curved arrow toward exit -->
  <path d="M175 100 Q200 95 215 75" stroke="#FF6F00" stroke-width="3" fill="none" stroke-dasharray="7,4" marker-end="url(#oa)" stroke-linecap="round"/>
  <defs>
    <marker id="oa" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 Z" fill="#FF6F00"/>
    </marker>
  </defs>
</svg>
