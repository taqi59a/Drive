<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="#fff5f5"/>
  <!-- Car body -->
  <rect x="30" y="110" width="110" height="45" rx="8" fill="#c0392b"/>
  <rect x="50" y="90" width="70" height="35" rx="6" fill="#c0392b"/>
  <!-- Windows -->
  <rect x="55" y="95" width="28" height="24" rx="3" fill="#a8d8f0"/>
  <rect x="87" y="95" width="28" height="24" rx="3" fill="#a8d8f0"/>
  <!-- Wheels -->
  <circle cx="60" cy="158" r="13" fill="#222"/>
  <circle cx="60" cy="158" r="6" fill="#888"/>
  <circle cx="118" cy="158" r="13" fill="#222"/>
  <circle cx="118" cy="158" r="6" fill="#888"/>
  <!-- Headlight -->
  <rect x="30" y="118" width="10" height="8" rx="2" fill="#f1c40f"/>
  <!-- Scales of justice -->
  <line x1="210" y1="60" x2="210" y2="150" stroke="#8B6914" stroke-width="3"/>
  <line x1="180" y1="80" x2="240" y2="80" stroke="#8B6914" stroke-width="3"/>
  <!-- Left pan -->
  <path d="M180,80 Q175,100 170,105 Q175,108 185,108 Q195,108 190,105 Q185,100 180,80" fill="none" stroke="#8B6914" stroke-width="2"/>
  <line x1="170" y1="105" x2="190" y2="105" stroke="#8B6914" stroke-width="2"/>
  <!-- Right pan -->
  <path d="M240,80 Q235,100 230,105 Q235,108 245,108 Q255,108 250,105 Q245,100 240,80" fill="none" stroke="#8B6914" stroke-width="2"/>
  <line x1="230" y1="105" x2="250" y2="105" stroke="#8B6914" stroke-width="2"/>
  <!-- Base -->
  <rect x="205" y="148" width="10" height="6" fill="#8B6914"/>
  <line x1="195" y1="154" x2="225" y2="154" stroke="#8B6914" stroke-width="3"/>
  <!-- Red X over scales area -->
  <circle cx="210" cy="105" r="52" fill="none" stroke="#e74c3c" stroke-width="5"/>
  <line x1="173" y1="68" x2="247" y2="142" stroke="#e74c3c" stroke-width="5"/>
  <!-- Label -->
  <text x="150" y="185" text-anchor="middle" font-family="Arial" font-size="11" fill="#c0392b" font-weight="bold">NO INSURANCE</text>
</svg>