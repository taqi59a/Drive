<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Road -->
  <rect x="0" y="120" width="300" height="80" fill="#777"/>
  <rect x="0" y="110" width="300" height="12" fill="#ddd"/>
  <!-- Pavement -->
  <rect x="0" y="0" width="300" height="110" fill="#e8e0d0"/>
  <!-- Kerb line -->
  <line x1="0" y1="110" x2="300" y2="110" stroke="#bbb" stroke-width="3"/>
  <!-- Person figure -->
  <circle cx="80" cy="55" r="14" fill="#333"/>
  <line x1="80" y1="69" x2="80" y2="105" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <line x1="80" y1="80" x2="60" y2="93" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="80" x2="100" y2="93" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="105" x2="68" y2="122" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="105" x2="92" y2="122" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <!-- White cane -->
  <line x1="100" y1="93" x2="115" y2="130" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <circle cx="115" cy="132" r="4" fill="red"/>
  <!-- Approaching car (top-down) -->
  <g transform="translate(185,130)">
    <rect x="0" y="-30" width="38" height="60" rx="8" fill="#E53935" stroke="#B71C1C" stroke-width="2"/>
    <rect x="5" y="-22" width="28" height="16" rx="3" fill="#FFCCBC"/>
    <rect x="5" y="14" width="28" height="14" rx="3" fill="#FFCCBC"/>
    <rect x="-5" y="-18" width="7" height="12" rx="2" fill="#222"/>
    <rect x="36" y="-18" width="7" height="12" rx="2" fill="#222"/>
    <rect x="-5" y="16" width="7" height="12" rx="2" fill="#222"/>
    <rect x="36" y="16" width="7" height="12" rx="2" fill="#222"/>
  </g>
  <!-- Motion arrow -->
  <path d="M195 90 L195 108" stroke="#E53935" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 Z" fill="#E53935"/>
    </marker>
  </defs>
</svg>
