<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#fff5f5"/>
  <text x="150" y="16" text-anchor="middle" font-family="Arial" font-size="12" fill="#2c3e50" font-weight="bold">BLEEDING CONTROL — DIRECT PRESSURE</text>
  <!-- Arm with wound -->
  <rect x="80" y="80" width="140" height="55" rx="28" fill="#f5cba7"/>
  <!-- Wound area -->
  <ellipse cx="150" cy="107" rx="18" ry="10" fill="#c0392b" opacity="0.7"/>
  <!-- Blood drops -->
  <circle cx="145" cy="103" r="3" fill="#e74c3c"/>
  <circle cx="155" cy="105" r="2.5" fill="#e74c3c"/>
  <circle cx="150" cy="100" r="2" fill="#e74c3c"/>
  <!-- Pressure bandage wrapped around -->
  <rect x="120" y="78" width="60" height="60" rx="5" fill="none" stroke="white" stroke-width="8"/>
  <!-- Bandage wrap lines -->
  <line x1="118" y1="95" x2="182" y2="95" stroke="white" stroke-width="5"/>
  <line x1="118" y1="108" x2="182" y2="108" stroke="white" stroke-width="5"/>
  <line x1="118" y1="121" x2="182" y2="121" stroke="white" stroke-width="5"/>
  <!-- Red cross on bandage pad -->
  <rect x="136" y="88" width="28" height="28" rx="3" fill="white" stroke="#ddd" stroke-width="1"/>
  <rect x="147" y="90" width="6" height="24" fill="#e74c3c"/>
  <rect x="138" y="99" width="24" height="6" fill="#e74c3c"/>
  <!-- Hand pressing down -->
  <!-- Palm -->
  <ellipse cx="150" cy="68" rx="28" ry="18" fill="#f5cba7"/>
  <!-- Fingers -->
  <rect x="118" y="50" width="9" height="22" rx="5" fill="#f5cba7"/>
  <rect x="130" y="45" width="9" height="26" rx="5" fill="#f5cba7"/>
  <rect x="142" y="43" width="9" height="27" rx="5" fill="#f5cba7"/>
  <rect x="154" y="44" width="9" height="26" rx="5" fill="#f5cba7"/>
  <rect x="166" y="48" width="9" height="22" rx="5" fill="#f5cba7"/>
  <!-- Thumb -->
  <rect x="174" y="60" width="18" height="9" rx="5" fill="#f5cba7" transform="rotate(30,183,65)"/>
  <!-- Pressure down arrows -->
  <line x1="135" y1="30" x2="135" y2="44" stroke="#e74c3c" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="150" y1="27" x2="150" y2="42" stroke="#e74c3c" stroke-width="2.5"/>
  <line x1="165" y1="30" x2="165" y2="44" stroke="#e74c3c" stroke-width="2.5"/>
  <polygon points="128,44 135,52 142,44" fill="#e74c3c"/>
  <polygon points="143,42 150,50 157,42" fill="#e74c3c"/>
  <polygon points="158,44 165,52 172,44" fill="#e74c3c"/>
  <text x="150" y="175" text-anchor="middle" font-family="Arial" font-size="10" fill="#e74c3c" font-weight="bold">PRESS FIRMLY · DO NOT REMOVE DRESSING</text>
</svg>