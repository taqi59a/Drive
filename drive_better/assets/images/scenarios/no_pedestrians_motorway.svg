<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="300" height="200" fill="#f5f5f5"/>
  <!-- Red circle border -->
  <circle cx="150" cy="100" r="88" fill="white" stroke="#E53935" stroke-width="12"/>
  <!-- Pedestrian silhouette (left) -->
  <g transform="translate(95,100)">
    <circle cx="0" cy="-42" r="10" fill="#333"/>
    <line x1="0" y1="-32" x2="0" y2="-5" stroke="#333" stroke-width="7" stroke-linecap="round"/>
    <line x1="0" y1="-20" x2="-14" y2="-8" stroke="#333" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="-20" x2="14" y2="-8" stroke="#333" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="-5" x2="-10" y2="18" stroke="#333" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="-5" x2="10" y2="18" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Bicycle silhouette (right) -->
  <g transform="translate(175,100)">
    <circle cx="-16" cy="10" r="14" fill="none" stroke="#333" stroke-width="4"/>
    <circle cx="16" cy="10" r="14" fill="none" stroke="#333" stroke-width="4"/>
    <path d="M-16,10 L0,-10 L16,10" fill="none" stroke="#333" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="0" y1="-10" x2="0" y2="-22" stroke="#333" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-6" y1="-22" x2="6" y2="-22" stroke="#333" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="-30" r="7" fill="#333"/>
  </g>
  <!-- Red diagonal bar -->
  <line x1="72" y1="38" x2="228" y2="162" stroke="#E53935" stroke-width="16" stroke-linecap="round"/>
</svg>
