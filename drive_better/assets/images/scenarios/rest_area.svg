<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="300" height="200" fill="#E3F2FD"/>
  <!-- Blue rest area sign -->
  <rect x="15" y="20" width="90" height="80" rx="8" fill="#1565C0" stroke="#0D47A1" stroke-width="2"/>
  <!-- Picnic table icon -->
  <line x1="50" y1="55" x2="70" y2="55" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="42" y1="65" x2="78" y2="65" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="48" y1="55" x2="44" y2="68" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="72" y1="55" x2="76" y2="68" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- "P" parking symbol -->
  <text x="60" y="90" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="white">P</text>
  <!-- Parked car -->
  <g transform="translate(145,80)">
    <rect x="-30" y="-20" width="60" height="40" rx="8" fill="#78909C" stroke="#546E7A" stroke-width="2"/>
    <rect x="-22" y="-14" width="44" height="18" rx="3" fill="#B3E5FC"/>
    <circle cx="-20" cy="22" r="10" fill="#333"/>
    <circle cx="-20" cy="22" r="4" fill="#888"/>
    <circle cx="20" cy="22" r="10" fill="#333"/>
    <circle cx="20" cy="22" r="4" fill="#888"/>
  </g>
  <!-- Sleeping Z with red X (no overnight sleeping) -->
  <g transform="translate(230,60)">
    <circle cx="0" cy="0" r="30" fill="white" stroke="#E53935" stroke-width="5"/>
    <text x="0" y="8" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#555">Z</text>
    <line x1="-22" y1="-22" x2="22" y2="22" stroke="#E53935" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Ground -->
  <rect x="0" y="160" width="300" height="40" fill="#8D6E63"/>
  <!-- Parked car wheels on ground -->
  <rect x="115" y="152" width="60" height="10" fill="#455A64" rx="2"/>
</svg>
