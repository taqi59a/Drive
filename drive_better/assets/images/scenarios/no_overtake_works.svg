<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#f0f4f8"/>
  <!-- Road -->
  <rect x="0" y="90" width="300" height="90" fill="#777"/>
  <line x1="0" y1="135" x2="300" y2="135" stroke="white" stroke-width="3"/>
  <!-- Road works zone - orange hatching -->
  <rect x="100" y="90" width="100" height="90" fill="#e67e22" opacity="0.3"/>
  <line x1="100" y1="90" x2="100" y2="180" stroke="#e67e22" stroke-width="3" stroke-dasharray="8,4"/>
  <line x1="200" y1="90" x2="200" y2="180" stroke="#e67e22" stroke-width="3" stroke-dasharray="8,4"/>
  <!-- Diagonal orange stripes in works zone -->
  <line x1="100" y1="90" x2="140" y2="180" stroke="#e67e22" stroke-width="2" opacity="0.5"/>
  <line x1="120" y1="90" x2="160" y2="180" stroke="#e67e22" stroke-width="2" opacity="0.5"/>
  <line x1="140" y1="90" x2="180" y2="180" stroke="#e67e22" stroke-width="2" opacity="0.5"/>
  <line x1="160" y1="90" x2="200" y2="180" stroke="#e67e22" stroke-width="2" opacity="0.5"/>
  <!-- Traffic cones -->
  <polygon points="105,90 112,90 110,110 107,110" fill="#e67e22"/>
  <rect x="104" y="110" width="9" height="3" fill="white"/>
  <rect x="103" y="113" width="11" height="4" fill="#e67e22"/>
  <polygon points="145,90 152,90 150,110 147,110" fill="#e67e22"/>
  <rect x="144" y="110" width="9" height="3" fill="white"/>
  <rect x="143" y="113" width="11" height="4" fill="#e67e22"/>
  <polygon points="185,90 192,90 190,110 187,110" fill="#e67e22"/>
  <rect x="184" y="110" width="9" height="3" fill="white"/>
  <rect x="183" y="113" width="11" height="4" fill="#e67e22"/>
  <!-- No overtaking sign -->
  <circle cx="55" cy="55" r="35" fill="white" stroke="#e74c3c" stroke-width="4"/>
  <rect x="34" y="38" width="20" height="12" rx="3" fill="#555"/>
  <rect x="34" y="43" width="14" height="8" rx="2" fill="#666"/>
  <rect x="46" y="38" width="20" height="12" rx="3" fill="#e74c3c"/>
  <rect x="46" y="43" width="14" height="8" rx="2" fill="#c0392b"/>
  <line x1="24" y1="25" x2="86" y2="85" stroke="#e74c3c" stroke-width="5"/>
  <!-- ROAD WORKS warning sign -->
  <polygon points="245,20 275,70 215,70" fill="#f39c12" stroke="#2c3e50" stroke-width="2"/>
  <text x="245" y="55" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#2c3e50">!</text>
  <text x="245" y="84" text-anchor="middle" font-family="Arial" font-size="9" fill="#2c3e50">ROAD WORKS</text>
  <text x="150" y="196" text-anchor="middle" font-family="Arial" font-size="11" fill="#2c3e50" font-weight="bold">NO OVERTAKING IN WORKS ZONE</text>
</svg>