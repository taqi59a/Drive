<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#4a7c59"/>
  <!-- Roundabout road ring -->
  <circle cx="150" cy="100" r="72" fill="#777"/>
  <circle cx="150" cy="100" r="50" fill="#4a7c59"/>
  <circle cx="150" cy="100" r="30" fill="#888"/>
  <circle cx="150" cy="100" r="22" fill="#5a8c69"/>
  <!-- Entry roads -->
  <rect x="60" y="88" width="18" height="24" fill="#777"/>
  <rect x="222" y="88" width="18" height="24" fill="#777"/>
  <rect x="138" y="28" width="24" height="20" fill="#777"/>
  <rect x="138" y="152" width="24" height="20" fill="#777"/>
  <!-- Direction arrows on ring (clockwise) -->
  <path d="M150,55 A45,45 0 0,1 195,100" stroke="white" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="white"/>
    </marker>
  </defs>
  <!-- Car inside roundabout (has priority) -->
  <g transform="translate(168,68) rotate(45)">
    <rect x="-18" y="-10" width="36" height="20" rx="3" fill="#cc3322"/>
    <rect x="-12" y="-15" width="22" height="10" rx="2" fill="#ee4433"/>
    <circle cx="-10" cy="12" r="5" fill="#222"/>
    <circle cx="12" cy="12" r="5" fill="#222"/>
  </g>
  <!-- Priority star/yield at entry -->
  <g transform="translate(65,100)">
    <polygon points="0,-10 3,-3 10,-3 4,2 6,10 0,5 -6,10 -4,2 -10,3 -3,-3" fill="#FFD700" stroke="#cc8800" stroke-width="1"/>
  </g>
  <!-- Car at entry waiting -->
  <g transform="translate(35,93)">
    <rect x="0" y="0" width="26" height="14" rx="3" fill="#2255aa"/>
    <rect x="4" y="-4" width="16" height="8" rx="2" fill="#3377cc"/>
    <circle cx="5" cy="15" r="4" fill="#222"/>
    <circle cx="20" cy="15" r="4" fill="#222"/>
  </g>
  <!-- CEDEZ label -->
  <text x="52" y="125" text-anchor="middle" font-family="Arial" font-size="7" fill="white">CÉDEZ</text>
  <text x="150" y="192" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Priorité dans le giratoire</text>
</svg>
