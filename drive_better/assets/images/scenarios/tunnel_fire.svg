<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky -->
  <rect x="0" y="0" width="300" height="200" fill="#37474F"/>
  <!-- Tunnel arch -->
  <path d="M30 180 L30 100 Q30 30 150 30 Q270 30 270 100 L270 180 Z" fill="#546E7A" stroke="#37474F" stroke-width="3"/>
  <!-- Tunnel interior -->
  <path d="M55 180 L55 105 Q55 55 150 55 Q245 55 245 105 L245 180 Z" fill="#263238"/>
  <!-- Road inside tunnel -->
  <rect x="55" y="150" width="190" height="30" fill="#455A64"/>
  <!-- Tunnel lights -->
  <circle cx="90" cy="75" r="5" fill="#FFF9C4" opacity="0.9"/>
  <circle cx="150" cy="62" r="5" fill="#FFF9C4" opacity="0.9"/>
  <circle cx="210" cy="75" r="5" fill="#FFF9C4" opacity="0.9"/>
  <!-- Car inside tunnel -->
  <g transform="translate(115,150)">
    <rect x="-20" y="-22" width="40" height="22" rx="6" fill="#607D8B" stroke="#455A64" stroke-width="1.5"/>
    <rect x="-14" y="-18" width="28" height="12" rx="3" fill="#B3E5FC" opacity="0.7"/>
    <!-- Wheels -->
    <rect x="-24" y="-10" width="8" height="10" rx="2" fill="#222"/>
    <rect x="16" y="-10" width="8" height="10" rx="2" fill="#222"/>
  </g>
  <!-- Flame symbol -->
  <g transform="translate(200,120)">
    <path d="M0,30 C-15,20 -20,5 -8,-5 C-12,5 -2,8 0,0 C2,8 12,5 8,-5 C20,5 15,20 0,30 Z" fill="#FF6F00"/>
    <path d="M0,25 C-8,18 -10,8 -4,2 C-6,8 0,10 0,5 C0,10 6,8 4,2 C10,8 8,18 0,25 Z" fill="#FFD740"/>
  </g>
  <!-- Exit arrow -->
  <g transform="translate(245,140)">
    <rect x="-5" y="-20" width="40" height="28" rx="4" fill="#4CAF50"/>
    <text x="15" y="-2" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="white">EXIT</text>
    <path d="M5,5 L25,5" stroke="white" stroke-width="2.5" fill="none" marker-end="url(#ea)"/>
  </g>
  <defs>
    <marker id="ea" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 Z" fill="white"/>
    </marker>
  </defs>
</svg>
