<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#f8f9fa"/>
  <!-- Horn symbol center -->
  <path d="M120,80 L140,95 L140,125 L120,140 Z" fill="#2c3e50"/>
  <rect x="100" y="100" width="22" height="20" rx="3" fill="#2c3e50"/>
  <!-- Sound waves -->
  <path d="M148,100 Q158,110 148,120" fill="none" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
  <path d="M155,93 Q170,110 155,127" fill="none" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
  <path d="M162,86 Q182,110 162,134" fill="none" stroke="#2c3e50" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Divider -->
  <line x1="10" y1="158" x2="290" y2="158" stroke="#bdc3c7" stroke-width="1.5"/>
  <!-- Left: Outside town - checkmark green -->
  <rect x="10" y="162" width="130" height="32" rx="4" fill="#e8f8f0"/>
  <text x="28" y="174" font-family="Arial" font-size="9" fill="#555">Outside town</text>
  <!-- Green checkmark -->
  <circle cx="110" cy="178" r="10" fill="#27ae60"/>
  <polyline points="104,178 108,183 117,172" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right: In town at night - red X -->
  <rect x="155" y="162" width="135" height="32" rx="4" fill="#fff0f0"/>
  <text x="162" y="174" font-family="Arial" font-size="9" fill="#555">In town at night</text>
  <circle cx="272" cy="178" r="10" fill="#e74c3c"/>
  <line x1="266" y1="172" x2="278" y2="184" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="278" y1="172" x2="266" y2="184" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Label -->
  <text x="150" y="152" text-anchor="middle" font-family="Arial" font-size="11" fill="#2c3e50" font-weight="bold">HORN USE</text>
</svg>