<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#f0f4f8"/>
  <!-- Road -->
  <rect x="0" y="60" width="300" height="120" fill="#777"/>
  <!-- Bus lane (left lane) -->
  <rect x="0" y="60" width="140" height="120" fill="#666"/>
  <!-- Bus lane marking -->
  <rect x="0" y="60" width="140" height="28" fill="#555"/>
  <text x="70" y="80" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">BUS LANE</text>
  <!-- Lane divider (solid white - no entry for cars) -->
  <line x1="140" y1="60" x2="140" y2="180" stroke="white" stroke-width="3"/>
  <!-- Centre line right lane -->
  <line x1="220" y1="60" x2="220" y2="180" stroke="white" stroke-width="2" stroke-dasharray="12,8"/>
  <!-- Road edge lines -->
  <line x1="0" y1="178" x2="300" y2="178" stroke="white" stroke-width="2"/>
  <!-- Bus in bus lane -->
  <rect x="10" y="95" width="110" height="60" rx="5" fill="#e74c3c"/>
  <rect x="15" y="88" width="100" height="18" rx="4" fill="#c0392b"/>
  <rect x="18" y="100" width="18" height="16" rx="2" fill="#a8d8f0"/>
  <rect x="42" y="100" width="18" height="16" rx="2" fill="#a8d8f0"/>
  <rect x="66" y="100" width="18" height="16" rx="2" fill="#a8d8f0"/>
  <rect x="90" y="100" width="18" height="16" rx="2" fill="#a8d8f0"/>
  <circle cx="35" cy="158" r="9" fill="#222"/>
  <circle cx="95" cy="158" r="9" fill="#222"/>
  <!-- Emergency vehicle (ambulance) in bus lane -->
  <rect x="155" y="110" width="80" height="45" rx="5" fill="#27ae60"/>
  <rect x="162" y="100" width="60" height="18" rx="4" fill="#1e8449"/>
  <rect x="164" y="103" width="20" height="12" rx="2" fill="#a8d8f0"/>
  <rect x="187" y="103" width="20" height="12" rx="2" fill="#a8d8f0"/>
  <!-- Red cross on ambulance -->
  <rect x="220" y="118" width="5" height="15" fill="white"/>
  <rect x="215" y="123" width="15" height="5" fill="white"/>
  <!-- Siren light -->
  <circle cx="195" cy="110" r="5" fill="#e74c3c"/>
  <circle cx="207" cy="110" r="5" fill="#3498db"/>
  <circle cx="235" cy="155" r="9" fill="#222"/>
  <circle cx="175" cy="155" r="9" fill="#222"/>
  <text x="150" y="197" text-anchor="middle" font-family="Arial" font-size="11" fill="#2c3e50" font-weight="bold">BUS LANE (+ EMERGENCY VEHICLES)</text>
</svg>