<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#1a1a2e"/>
  <!-- Phone body -->
  <rect x="90" y="15" width="120" height="170" rx="16" fill="#2c2c3e" stroke="#555" stroke-width="2"/>
  <!-- Screen -->
  <rect x="98" y="28" width="104" height="140" rx="8" fill="#0a1628"/>
  <!-- EU flag circle of stars at top -->
  <circle cx="150" cy="55" r="20" fill="#003399"/>
  <!-- 12 stars in circle -->
  <g fill="#ffcc00" font-size="7" text-anchor="middle">
    <text x="150" y="40">★</text>
    <text x="160" y="43">★</text>
    <text x="167" y="51">★</text>
    <text x="167" y="61">★</text>
    <text x="160" y="69">★</text>
    <text x="150" y="72">★</text>
    <text x="140" y="69">★</text>
    <text x="133" y="61">★</text>
    <text x="133" y="51">★</text>
    <text x="140" y="43">★</text>
  </g>
  <!-- 112 display -->
  <rect x="105" y="88" width="90" height="48" rx="6" fill="#e74c3c"/>
  <text x="150" y="122" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="white">112</text>
  <!-- EMERGENCY text -->
  <text x="150" y="150" text-anchor="middle" font-family="Arial" font-size="10" fill="#aaa">EMERGENCY</text>
  <!-- Call button -->
  <rect x="120" y="155" width="60" height="20" rx="10" fill="#27ae60"/>
  <text x="150" y="169" text-anchor="middle" font-family="Arial" font-size="11" fill="white">CALL</text>
  <!-- Home button -->
  <circle cx="150" cy="178" r="6" fill="#444" stroke="#666" stroke-width="1"/>
  <text x="150" y="196" text-anchor="middle" font-family="Arial" font-size="11" fill="#aaa" font-weight="bold">EMERGENCY: 112</text>
</svg>