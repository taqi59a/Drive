<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#f0f4f8"/>
  <!-- Road -->
  <rect x="0" y="110" width="300" height="70" fill="#777"/>
  <line x1="0" y1="145" x2="300" y2="145" stroke="white" stroke-width="2" stroke-dasharray="15,10"/>
  <line x1="0" y1="178" x2="300" y2="178" stroke="white" stroke-width="2"/>
  <!-- Road worker silhouette -->
  <!-- Hard hat -->
  <ellipse cx="195" cy="52" rx="18" ry="10" fill="#f39c12"/>
  <rect x="180" y="56" width="30" height="5" rx="2" fill="#f39c12"/>
  <!-- Head -->
  <circle cx="195" cy="68" r="12" fill="#f5cba7"/>
  <!-- Hi-vis jacket body -->
  <rect x="180" y="80" width="30" height="35" rx="4" fill="#f39c12"/>
  <!-- Hi-vis stripes -->
  <rect x="178" y="90" width="34" height="5" fill="#f1c40f"/>
  <rect x="178" y="100" width="34" height="5" fill="#f1c40f"/>
  <!-- Arms -->
  <line x1="180" y1="85" x2="162" y2="100" stroke="#f39c12" stroke-width="8" stroke-linecap="round"/>
  <line x1="210" y1="85" x2="228" y2="100" stroke="#f39c12" stroke-width="8" stroke-linecap="round"/>
  <!-- Stop/slow lollipop sign -->
  <line x1="228" y1="100" x2="228" y2="130" stroke="#555" stroke-width="3"/>
  <circle cx="228" cy="88" r="14" fill="#e74c3c" stroke="white" stroke-width="2"/>
  <text x="228" y="93" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="white">SLOW</text>
  <!-- Legs -->
  <line x1="190" y1="115" x2="186" y2="140" stroke="#555" stroke-width="7" stroke-linecap="round"/>
  <line x1="200" y1="115" x2="204" y2="140" stroke="#555" stroke-width="7" stroke-linecap="round"/>
  <!-- Approaching car slowing (speed lines fading) -->
  <rect x="20" y="118" width="65" height="32" rx="6" fill="#3a7bd5"/>
  <rect x="30" y="107" width="45" height="19" rx="4" fill="#3a7bd5"/>
  <rect x="33" y="110" width="16" height="13" rx="2" fill="#a8d8f0"/>
  <rect x="52" y="110" width="16" height="13" rx="2" fill="#a8d8f0"/>
  <circle cx="34" cy="152" r="9" fill="#222"/>
  <circle cx="75" cy="152" r="9" fill="#222"/>
  <!-- Speed lines (fading = slowing) -->
  <line x1="12" y1="125" x2="20" y2="125" stroke="#aaa" stroke-width="2" opacity="0.8"/>
  <line x1="8" y1="133" x2="20" y2="133" stroke="#aaa" stroke-width="2" opacity="0.5"/>
  <line x1="5" y1="141" x2="20" y2="141" stroke="#aaa" stroke-width="2" opacity="0.3"/>
  <!-- SLOW text on road -->
  <text x="110" y="167" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white" letter-spacing="3">SLOW</text>
  <text x="150" y="196" text-anchor="middle" font-family="Arial" font-size="11" fill="#2c3e50" font-weight="bold">SLOW PAST ROAD WORKERS</text>
</svg>