<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#f0f4f8"/>
  <!-- Road single lane -->
  <rect x="80" y="100" width="140" height="80" fill="#777"/>
  <line x1="150" y1="100" x2="150" y2="180" stroke="white" stroke-width="2" stroke-dasharray="10,8" opacity="0.4"/>
  <line x1="82" y1="178" x2="218" y2="178" stroke="white" stroke-width="2"/>
  <!-- Portable traffic light stand (left side) -->
  <!-- Base/feet -->
  <line x1="60" y1="160" x2="40" y2="165" stroke="#555" stroke-width="3"/>
  <line x1="60" y1="160" x2="80" y2="165" stroke="#555" stroke-width="3"/>
  <!-- Pole -->
  <rect x="57" y="60" width="6" height="100" fill="#555"/>
  <!-- Light housing -->
  <rect x="44" y="35" width="32" height="60" rx="6" fill="#2c2c2c" stroke="#444" stroke-width="2"/>
  <!-- Red light (lit) -->
  <circle cx="60" cy="52" r="10" fill="#e74c3c"/>
  <circle cx="56" cy="49" r="3" fill="#ff8080" opacity="0.5"/>
  <!-- Green light (unlit) -->
  <circle cx="60" cy="80" r="10" fill="#1a3d1a"/>
  <!-- Portable traffic light stand (right side) -->
  <line x1="240" y1="160" x2="220" y2="165" stroke="#555" stroke-width="3"/>
  <line x1="240" y1="160" x2="260" y2="165" stroke="#555" stroke-width="3"/>
  <rect x="237" y="60" width="6" height="100" fill="#555"/>
  <rect x="224" y="35" width="32" height="60" rx="6" fill="#2c2c2c" stroke="#444" stroke-width="2"/>
  <!-- Green light (lit) for other direction -->
  <circle cx="240" cy="52" r="10" fill="#1a3d1a"/>
  <circle cx="240" cy="80" r="10" fill="#27ae60"/>
  <circle cx="236" cy="77" r="3" fill="#aaffaa" opacity="0.5"/>
  <!-- Car waiting at red -->
  <rect x="97" y="120" width="52" height="28" rx="5" fill="#3a7bd5"/>
  <rect x="104" y="110" width="36" height="18" rx="4" fill="#3a7bd5"/>
  <rect x="106" y="113" width="13" height="12" rx="2" fill="#a8d8f0"/>
  <rect x="122" y="113" width="13" height="12" rx="2" fill="#a8d8f0"/>
  <circle cx="110" cy="150" r="8" fill="#222"/>
  <circle cx="138" cy="150" r="8" fill="#222"/>
  <!-- STOP indicator -->
  <line x1="123" y1="120" x2="123" y2="108" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="150" y="194" text-anchor="middle" font-family="Arial" font-size="11" fill="#2c3e50" font-weight="bold">TEMPORARY TRAFFIC LIGHTS</text>
</svg>