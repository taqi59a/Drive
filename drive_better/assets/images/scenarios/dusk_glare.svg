<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffa0" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffcc00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a4a"/>
      <stop offset="50%" stop-color="#cc4400"/>
      <stop offset="100%" stop-color="#ff8800"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="300" height="200" fill="url(#skyGrad)"/>
  <!-- Road -->
  <rect x="0" y="130" width="300" height="70" fill="#333"/>
  <line x1="0" y1="165" x2="300" y2="165" stroke="#555" stroke-width="2" stroke-dasharray="20,10"/>
  <!-- Horizon glow -->
  <ellipse cx="150" cy="130" rx="200" ry="25" fill="#ff6600" opacity="0.3"/>
  <!-- Sun near horizon -->
  <circle cx="150" cy="125" r="22" fill="url(#sunGlow)"/>
  <circle cx="150" cy="125" r="16" fill="#ffffa0"/>
  <!-- Sun rays -->
  <g stroke="#ffcc00" stroke-width="2" opacity="0.6">
    <line x1="150" y1="100" x2="150" y2="92"/>
    <line x1="168" y1="107" x2="174" y2="101"/>
    <line x1="175" y1="125" x2="183" y2="125"/>
    <line x1="168" y1="143" x2="174" y2="149"/>
    <line x1="132" y1="107" x2="126" y2="101"/>
    <line x1="125" y1="125" x2="117" y2="125"/>
    <line x1="132" y1="143" x2="126" y2="149"/>
  </g>
  <!-- Glare cone on road -->
  <polygon points="150,130 80,170 220,170" fill="#ffffa0" opacity="0.18"/>
  <!-- Car silhouette -->
  <g transform="translate(75,138)">
    <rect x="0" y="0" width="80" height="30" rx="5" fill="#111"/>
    <rect x="10" y="-10" width="52" height="20" rx="4" fill="#1a1a1a"/>
    <circle cx="14" cy="32" r="8" fill="#0a0a0a"/>
    <circle cx="64" cy="32" r="8" fill="#0a0a0a"/>
    <!-- Headlights on -->
    <rect x="76" y="7" width="8" height="5" fill="#ffffcc"/>
    <rect x="76" y="15" width="8" height="5" fill="#ffffcc"/>
    <!-- Headlight beams -->
    <polygon points="84,9 160,0 160,30 84,20" fill="#ffffcc" opacity="0.12"/>
  </g>
  <text x="150" y="196" text-anchor="middle" font-family="Arial" font-size="12" fill="#ffcc88">Éblouissement au crépuscule</text>
</svg>
