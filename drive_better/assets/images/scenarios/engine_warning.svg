<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Dashboard background -->
  <rect x="0" y="0" width="300" height="200" fill="#1A1A2E"/>
  <!-- Dashboard panel -->
  <rect x="20" y="30" width="260" height="140" rx="16" fill="#0D0D1A" stroke="#333" stroke-width="2"/>
  <!-- Speedometer circle (left) -->
  <circle cx="85" cy="100" r="50" fill="#111" stroke="#333" stroke-width="2"/>
  <path d="M45 120 A50 50 0 1 1 125 120" fill="none" stroke="#444" stroke-width="6" stroke-linecap="round"/>
  <path d="M45 120 A50 50 0 0 1 95 52" fill="none" stroke="#4CAF50" stroke-width="6" stroke-linecap="round"/>
  <line x1="85" y1="100" x2="110" y2="62" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="85" cy="100" r="5" fill="white"/>
  <text x="85" y="118" text-anchor="middle" font-family="Arial" font-size="9" fill="#aaa">km/h</text>
  <!-- RPM circle (right) -->
  <circle cx="215" cy="100" r="50" fill="#111" stroke="#333" stroke-width="2"/>
  <path d="M175 120 A50 50 0 1 1 255 120" fill="none" stroke="#444" stroke-width="6" stroke-linecap="round"/>
  <path d="M175 120 A50 50 0 0 1 220 52" fill="none" stroke="#4CAF50" stroke-width="6" stroke-linecap="round"/>
  <line x1="215" y1="100" x2="200" y2="60" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="215" cy="100" r="5" fill="white"/>
  <text x="215" y="118" text-anchor="middle" font-family="Arial" font-size="9" fill="#aaa">RPM</text>
  <!-- Engine warning light - centre cluster -->
  <rect x="120" y="78" width="60" height="44" rx="8" fill="#1A1A1A" stroke="#444" stroke-width="1.5"/>
  <!-- Engine outline icon in yellow -->
  <g transform="translate(150,100)" fill="none" stroke="#FFD600" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Engine block -->
    <rect x="-14" y="-8" width="28" height="16" rx="3"/>
    <!-- Left cylinder head -->
    <rect x="-20" y="-6" width="8" height="12" rx="2"/>
    <!-- Right exhaust pipe -->
    <line x1="14" y1="-2" x2="20" y2="-2"/>
    <line x1="20" y1="-2" x2="20" y2="4"/>
    <!-- Spark plugs / bolts on top -->
    <line x1="-8" y1="-8" x2="-8" y2="-13"/>
    <line x1="0" y1="-8" x2="0" y2="-13"/>
    <line x1="8" y1="-8" x2="8" y2="-13"/>
  </g>
  <!-- Yellow warning glow -->
  <circle cx="150" cy="100" r="26" fill="#FFD600" opacity="0.08"/>
</svg>
