<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Foggy background -->
  <rect x="0" y="0" width="300" height="200" fill="#546E7A"/>
  <!-- Fog effect -->
  <ellipse cx="150" cy="100" rx="130" ry="60" fill="white" opacity="0.15"/>
  <ellipse cx="150" cy="110" rx="150" ry="40" fill="white" opacity="0.1"/>
  <!-- Car rear view -->
  <rect x="65" y="70" width="170" height="90" rx="12" fill="#37474F" stroke="#263238" stroke-width="2"/>
  <!-- Boot/trunk -->
  <rect x="75" y="140" width="150" height="20" rx="6" fill="#455A64" stroke="#263238" stroke-width="1.5"/>
  <!-- Rear window -->
  <rect x="90" y="78" width="120" height="50" rx="6" fill="#78909C" opacity="0.6"/>
  <!-- Rear number plate area -->
  <rect x="110" y="145" width="80" height="14" rx="3" fill="#FFF9C4" stroke="#F9A825" stroke-width="1"/>
  <!-- Left rear fog light (yellow) -->
  <ellipse cx="88" cy="128" rx="16" ry="10" fill="#FFD600" stroke="#FF6F00" stroke-width="2.5"/>
  <!-- Right rear fog light (yellow) -->
  <ellipse cx="212" cy="128" rx="16" ry="10" fill="#FFD600" stroke="#FF6F00" stroke-width="2.5"/>
  <!-- Fog light glow -->
  <ellipse cx="88" cy="128" rx="28" ry="18" fill="#FFD600" opacity="0.2"/>
  <ellipse cx="212" cy="128" rx="28" ry="18" fill="#FFD600" opacity="0.2"/>
  <!-- Fog light symbol (dashboard style) -->
  <g transform="translate(150,35)">
    <rect x="-32" y="-20" width="64" height="40" rx="6" fill="#263238" stroke="#37474F" stroke-width="1.5"/>
    <!-- Light beam lines with downward squiggle (fog light symbol) -->
    <line x1="-15" y1="-8" x2="10" y2="-8" stroke="#FFD600" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-15" y1="0" x2="10" y2="0" stroke="#FFD600" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-15" y1="8" x2="10" y2="8" stroke="#FFD600" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Light source circle -->
    <circle cx="-20" cy="0" r="8" fill="none" stroke="#FFD600" stroke-width="2.5"/>
    <!-- Downward arrow squiggle -->
    <path d="M18,-8 Q22,-4 18,0 Q14,4 18,8" stroke="#FFD600" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
