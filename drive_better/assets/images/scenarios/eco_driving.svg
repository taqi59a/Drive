<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#e8f5e8"/>
  <!-- Road -->
  <rect x="0" y="120" width="300" height="50" fill="#777"/>
  <line x1="0" y1="145" x2="300" y2="145" stroke="white" stroke-width="2" stroke-dasharray="20,10"/>
  <!-- Car side view -->
  <g transform="translate(80,122)">
    <rect x="0" y="-28" width="110" height="42" rx="6" fill="#2255aa"/>
    <rect x="14" y="-42" width="70" height="26" rx="5" fill="#3377cc"/>
    <rect x="18" y="-38" width="28" height="18" rx="3" fill="#aaddff" opacity="0.8"/>
    <rect x="52" y="-38" width="25" height="18" rx="3" fill="#aaddff" opacity="0.8"/>
    <circle cx="18" cy="16" r="10" fill="#222"/>
    <circle cx="90" cy="16" r="10" fill="#222"/>
    <circle cx="18" cy="16" r="5" fill="#555"/>
    <circle cx="90" cy="16" r="5" fill="#555"/>
    <rect x="106" y="-15" width="8" height="6" fill="#ffffaa"/>
  </g>
  <!-- Green leaf -->
  <g transform="translate(218,55)">
    <path d="M0,0 Q30,-40 60,-20 Q40,20 0,0 Z" fill="#44aa44"/>
    <path d="M0,0 Q30,-40 60,-20" stroke="#228822" stroke-width="1.5" fill="none"/>
    <!-- Leaf vein -->
    <line x1="0" y1="0" x2="55" y2="-18" stroke="#228822" stroke-width="1.5"/>
    <line x1="20" y1="-10" x2="25" y2="-25" stroke="#228822" stroke-width="1"/>
    <line x1="38" y1="-16" x2="40" y2="-30" stroke="#228822" stroke-width="1"/>
  </g>
  <!-- Smooth acceleration arrow -->
  <path d="M30,90 Q80,60 140,75 Q190,88 240,70" stroke="#44aa44" stroke-width="3.5" fill="none" stroke-linecap="round" marker-end="url(#ecoA)"/>
  <defs>
    <marker id="ecoA" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#44aa44"/>
    </marker>
  </defs>
  <!-- ECO label -->
  <rect x="105" y="30" width="58" height="28" rx="6" fill="#228822"/>
  <text x="134" y="50" text-anchor="middle" font-family="Arial" font-size="16" fill="white" font-weight="bold">ECO</text>
  <text x="150" y="192" text-anchor="middle" font-family="Arial" font-size="12" fill="#228822">Conduite économique</text>
</svg>
