<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#f0f4f8"/>
  <!-- Human torso lying down -->
  <!-- Body outline -->
  <ellipse cx="150" cy="115" rx="55" ry="38" fill="#f5c88a" stroke="#d4a870" stroke-width="2"/>
  <!-- Chest detail -->
  <ellipse cx="150" cy="110" rx="45" ry="28" fill="#f0c080" opacity="0.5"/>
  <!-- Head -->
  <ellipse cx="150" cy="62" rx="28" ry="22" fill="#f5c88a" stroke="#d4a870" stroke-width="2"/>
  <!-- Shoulders / arms to sides -->
  <ellipse cx="92" cy="108" rx="22" ry="14" fill="#f5c88a" stroke="#d4a870" stroke-width="1.5"/>
  <ellipse cx="208" cy="108" rx="22" ry="14" fill="#f5c88a" stroke="#d4a870" stroke-width="1.5"/>
  <!-- Compression hands -->
  <!-- Left hand -->
  <ellipse cx="138" cy="108" rx="20" ry="12" fill="#e8a060" stroke="#c07030" stroke-width="2" transform="rotate(-10,138,108)"/>
  <!-- Right hand on top -->
  <ellipse cx="142" cy="100" rx="20" ry="12" fill="#d09050" stroke="#a06020" stroke-width="2" transform="rotate(-10,142,100)"/>
  <!-- Fingers suggestion -->
  <line x1="125" y1="96" x2="122" y2="88" stroke="#c07030" stroke-width="3" stroke-linecap="round"/>
  <line x1="131" y1="93" x2="129" y2="85" stroke="#c07030" stroke-width="3" stroke-linecap="round"/>
  <line x1="137" y1="91" x2="136" y2="83" stroke="#c07030" stroke-width="3" stroke-linecap="round"/>
  <line x1="143" y1="91" x2="143" y2="83" stroke="#c07030" stroke-width="3" stroke-linecap="round"/>
  <line x1="149" y1="93" x2="150" y2="85" stroke="#c07030" stroke-width="3" stroke-linecap="round"/>
  <!-- Pressure arrow -->
  <path d="M178,78 L178,96" stroke="#cc0000" stroke-width="3" fill="none" marker-end="url(#cprA)"/>
  <defs>
    <marker id="cprA" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#cc0000"/>
    </marker>
  </defs>
  <!-- CPR label -->
  <rect x="185" y="65" width="50" height="24" rx="5" fill="#cc0000"/>
  <text x="210" y="82" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">CPR</text>
  <!-- Heartbeat line -->
  <polyline points="30,160 60,160 70,140 80,175 90,145 100,160 270,160" stroke="#cc0000" stroke-width="2.5" fill="none"/>
  <text x="150" y="192" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">Réanimation cardio-pulmonaire</text>
</svg>
