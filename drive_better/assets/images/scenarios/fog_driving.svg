<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#b0b8c1"/>
  <!-- Fog layers -->
  <path d="M0,40 Q75,30 150,45 Q225,60 300,40" stroke="#d0d8e0" stroke-width="18" fill="none" opacity="0.7"/>
  <path d="M0,70 Q60,55 150,72 Q240,88 300,65" stroke="#d0d8e0" stroke-width="18" fill="none" opacity="0.7"/>
  <path d="M0,100 Q80,88 150,102 Q220,116 300,98" stroke="#c8d0d8" stroke-width="18" fill="none" opacity="0.6"/>
  <path d="M0,130 Q70,118 150,132 Q230,146 300,128" stroke="#c8d0d8" stroke-width="16" fill="none" opacity="0.5"/>
  <!-- Road -->
  <rect x="0" y="140" width="300" height="60" fill="#666" opacity="0.8"/>
  <line x1="0" y1="170" x2="300" y2="170" stroke="white" stroke-width="2" stroke-dasharray="25,12" opacity="0.6"/>
  <!-- Car silhouette -->
  <g transform="translate(110,130)">
    <rect x="0" y="10" width="70" height="28" rx="4" fill="#444"/>
    <rect x="10" y="0" width="45" height="18" rx="4" fill="#555"/>
    <circle cx="12" cy="38" r="7" fill="#222"/>
    <circle cx="56" cy="38" r="7" fill="#222"/>
    <!-- Fog lights -->
    <rect x="64" y="14" width="8" height="5" fill="#ffffaa" opacity="0.9"/>
    <!-- Rear lights -->
    <rect x="-2" y="14" width="5" height="5" fill="#ff4444" opacity="0.8"/>
  </g>
  <text x="150" y="195" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Conduite par brouillard</text>
</svg>
