<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#f8f9fa"/>
  <text x="150" y="18" text-anchor="middle" font-family="Arial" font-size="12" fill="#2c3e50" font-weight="bold">SAFE OVERTAKING CHECKS</text>
  <!-- Road at bottom -->
  <rect x="0" y="155" width="300" height="30" fill="#777"/>
  <line x1="0" y1="170" x2="300" y2="170" stroke="white" stroke-width="2" stroke-dasharray="15,10"/>
  <!-- Overtaking arrow -->
  <path d="M240,150 L240,110 L265,110" fill="none" stroke="#27ae60" stroke-width="3" stroke-linecap="round"/>
  <polygon points="260,104 272,110 260,116" fill="#27ae60"/>
  <!-- Car being overtaken -->
  <rect x="195" y="138" width="40" height="20" rx="4" fill="#e74c3c"/>
  <rect x="202" y="130" width="26" height="14" rx="3" fill="#e74c3c"/>
  <!-- Overtaking car -->
  <rect x="195" y="105" width="40" height="20" rx="4" fill="#27ae60"/>
  <rect x="202" y="97" width="26" height="14" rx="3" fill="#27ae60"/>
  <!-- Checklist items -->
  <!-- 1 -->
  <circle cx="22" cy="40" r="9" fill="#27ae60"/>
  <polyline points="16,40 20,45 28,35" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="38" y="44" font-family="Arial" font-size="11" fill="#2c3e50">Clear road ahead</text>
  <!-- 2 -->
  <circle cx="22" cy="68" r="9" fill="#27ae60"/>
  <polyline points="16,68 20,73 28,63" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="38" y="72" font-family="Arial" font-size="11" fill="#2c3e50">Check mirrors</text>
  <!-- 3 -->
  <circle cx="22" cy="96" r="9" fill="#27ae60"/>
  <polyline points="16,96 20,101 28,91" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="38" y="100" font-family="Arial" font-size="11" fill="#2c3e50">Signal intention</text>
  <!-- 4 -->
  <circle cx="22" cy="124" r="9" fill="#27ae60"/>
  <polyline points="16,124 20,129 28,119" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="38" y="128" font-family="Arial" font-size="11" fill="#2c3e50">Safe gap to return</text>
</svg>