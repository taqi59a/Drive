<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#1a1a2e"/>
  <!-- Gantry overhead structure -->
  <rect x="0" y="30" width="300" height="12" rx="4" fill="#888" stroke="#666" stroke-width="2"/>
  <rect x="10" y="42" width="8" height="80" fill="#888"/>
  <rect x="282" y="42" width="8" height="80" fill="#888"/>
  <!-- VMS sign board -->
  <rect x="30" y="42" width="240" height="75" rx="6" fill="#111" stroke="#555" stroke-width="2"/>
  <!-- Amber flashing light left -->
  <circle cx="55" cy="80" r="16" fill="#e67e00" opacity="0.9"/>
  <circle cx="55" cy="80" r="10" fill="#f39c12"/>
  <!-- Flash lines -->
  <line x1="38" y1="63" x2="42" y2="67" stroke="#f39c12" stroke-width="2"/>
  <line x1="30" y1="80" x2="36" y2="80" stroke="#f39c12" stroke-width="2"/>
  <line x1="38" y1="97" x2="42" y2="93" stroke="#f39c12" stroke-width="2"/>
  <!-- VMS display text -->
  <text x="150" y="70" font-size="14" font-family="monospace" font-weight="bold" fill="#f39c12" text-anchor="middle">TRAVAUX</text>
  <text x="150" y="92" font-size="14" font-family="monospace" font-weight="bold" fill="#f39c12" text-anchor="middle">2 km</text>
  <!-- Amber flashing light right -->
  <circle cx="245" cy="80" r="16" fill="#e67e00" opacity="0.9"/>
  <circle cx="245" cy="80" r="10" fill="#f39c12"/>
  <!-- Flash lines right -->
  <line x1="262" y1="63" x2="258" y2="67" stroke="#f39c12" stroke-width="2"/>
  <line x1="270" y1="80" x2="264" y2="80" stroke="#f39c12" stroke-width="2"/>
  <line x1="262" y1="97" x2="258" y2="93" stroke="#f39c12" stroke-width="2"/>
  <!-- Road below -->
  <rect x="0" y="145" width="300" height="55" fill="#555"/>
  <line x1="100" y1="145" x2="100" y2="200" stroke="white" stroke-width="2" stroke-dasharray="15,10"/>
  <line x1="200" y1="145" x2="200" y2="200" stroke="white" stroke-width="2" stroke-dasharray="15,10"/>
  <!-- Car on road -->
  <g transform="translate(115,148)">
    <rect x="0" y="0" width="30" height="50" rx="5" fill="#3498db" stroke="#2980b9" stroke-width="1.5"/>
    <rect x="4" y="4" width="22" height="15" rx="2" fill="#aad4f0"/>
    <circle cx="8" cy="53" r="5" fill="#222"/>
    <circle cx="22" cy="53" r="5" fill="#222"/>
  </g>
  <text x="150" y="195" font-family="Arial" font-size="10" fill="#f39c12" text-anchor="middle" font-weight="bold">VMS AMBER — OVERHEAD GANTRY WARNING</text>
</svg>
