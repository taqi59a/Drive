<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#e8e8e8"/>
  <!-- Road -->
  <rect x="0" y="50" width="300" height="120" fill="#777"/>
  <line x1="0" y1="110" x2="300" y2="110" stroke="white" stroke-width="2" stroke-dasharray="20,10"/>
  <!-- Car top-down going sideways (rotated ~20deg) -->
  <g transform="translate(150,105) rotate(22)">
    <!-- Car body -->
    <rect x="-38" y="-20" width="76" height="40" rx="6" fill="#2255aa"/>
    <!-- Windscreen -->
    <rect x="-28" y="-16" width="30" height="14" rx="2" fill="#aaddff" opacity="0.7"/>
    <!-- Rear window -->
    <rect x="4" y="-16" width="26" height="14" rx="2" fill="#aaddff" opacity="0.5"/>
    <!-- Wheels -->
    <rect x="-42" y="-18" width="10" height="8" rx="2" fill="#222"/>
    <rect x="-42" y="10" width="10" height="8" rx="2" fill="#222"/>
    <rect x="32" y="-18" width="10" height="8" rx="2" fill="#222"/>
    <rect x="32" y="10" width="10" height="8" rx="2" fill="#222"/>
  </g>
  <!-- Blowout burst at front-right tyre -->
  <g transform="translate(185,88)">
    <circle cx="0" cy="0" r="8" fill="#cc2200" opacity="0.85"/>
    <line x1="0" y1="-12" x2="0" y2="-18" stroke="#cc2200" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="-8" x2="13" y2="-13" stroke="#cc2200" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="0" x2="18" y2="0" stroke="#cc2200" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="8" x2="13" y2="13" stroke="#cc2200" stroke-width="3" stroke-linecap="round"/>
    <line x1="-8" y1="-8" x2="-13" y2="-13" stroke="#cc2200" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Skid marks -->
  <path d="M120,125 Q145,118 170,130" stroke="#333" stroke-width="4" fill="none" opacity="0.5" stroke-dasharray="6,4"/>
  <path d="M125,132 Q150,125 175,137" stroke="#333" stroke-width="3" fill="none" opacity="0.4" stroke-dasharray="6,4"/>
  <!-- Exclamation mark -->
  <circle cx="248" cy="88" r="22" fill="#FFD700" stroke="#cc8800" stroke-width="2"/>
  <rect x="244" y="72" width="8" height="20" rx="3" fill="#333"/>
  <circle cx="248" cy="100" r="4" fill="#333"/>
  <text x="150" y="188" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Éclatement de pneu</text>
</svg>
