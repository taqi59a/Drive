<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="300" height="200" fill="#FFF8E1"/>
  <!-- Car seat (front passenger) side view -->
  <rect x="55" y="40" width="80" height="130" rx="10" fill="#78909C" stroke="#546E7A" stroke-width="2"/>
  <rect x="63" y="48" width="64" height="85" rx="7" fill="#90A4AE"/>
  <rect x="63" y="136" width="64" height="30" rx="6" fill="#90A4AE"/>
  <!-- Rear-facing child seat on the seat -->
  <path d="M75,135 L75,80 Q75,55 95,55 Q115,55 115,80 L115,135 Z" fill="#EF9A9A" stroke="#E53935" stroke-width="2"/>
  <!-- Child in seat (simple) -->
  <circle cx="95" cy="75" r="10" fill="#FFCCBC"/>
  <!-- Airbag warning symbol -->
  <g transform="translate(210,95)">
    <circle cx="0" cy="0" r="45" fill="#FFF9C4" stroke="#F9A825" stroke-width="4"/>
    <!-- Airbag balloon shape -->
    <ellipse cx="0" cy="-8" rx="22" ry="20" fill="#FF6F00" opacity="0.85"/>
    <!-- Person silhouette -->
    <circle cx="0" cy="18" r="8" fill="#333"/>
    <line x1="0" y1="26" x2="0" y2="38" stroke="#333" stroke-width="5" stroke-linecap="round"/>
    <text x="0" y="55" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#E65100">AIRBAG</text>
  </g>
  <!-- Red X over airbag symbol -->
  <line x1="170" y1="55" x2="250" y2="135" stroke="#E53935" stroke-width="9" stroke-linecap="round"/>
  <line x1="250" y1="55" x2="170" y2="135" stroke="#E53935" stroke-width="9" stroke-linecap="round"/>
</svg>
