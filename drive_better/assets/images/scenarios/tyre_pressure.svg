<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="300" height="200" fill="#F5F5F5"/>
  <!-- Tyre outline -->
  <circle cx="110" cy="110" r="75" fill="#222" stroke="#111" stroke-width="3"/>
  <circle cx="110" cy="110" r="50" fill="#777" stroke="#555" stroke-width="2"/>
  <circle cx="110" cy="110" r="20" fill="#aaa"/>
  <!-- Tread marks -->
  <path d="M42 85 Q52 110 42 135" stroke="#444" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M52 72 Q66 110 52 148" stroke="#444" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M168 72 Q154 110 168 148" stroke="#444" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M178 85 Q168 110 178 135" stroke="#444" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Valve stem -->
  <rect x="106" y="32" width="8" height="16" rx="3" fill="#888" stroke="#666" stroke-width="1.5"/>
  <!-- Pressure gauge -->
  <g transform="translate(210,100)">
    <!-- Gauge circle -->
    <circle cx="0" cy="0" r="48" fill="white" stroke="#78909C" stroke-width="3"/>
    <circle cx="0" cy="0" r="44" fill="#F5F5F5" stroke="#90A4AE" stroke-width="1"/>
    <!-- Scale arc -->
    <path d="M-38,22 A44,44 0 1,1 38,22" fill="none" stroke="#CFD8DC" stroke-width="6" stroke-linecap="round"/>
    <path d="M-38,22 A44,44 0 0,1 8,-42" fill="none" stroke="#4CAF50" stroke-width="6" stroke-linecap="round"/>
    <!-- Needle -->
    <line x1="0" y1="0" x2="8" y2="-38" stroke="#E53935" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="#E53935"/>
    <!-- Labels -->
    <text x="0" y="20" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#333">2.4 bar</text>
    <text x="-36" y="30" text-anchor="middle" font-family="Arial" font-size="8" fill="#777">0</text>
    <text x="36" y="30" text-anchor="middle" font-family="Arial" font-size="8" fill="#777">4</text>
  </g>
  <!-- Connecting hose -->
  <path d="M155 108 Q175 108 162 70 Q158 55 170 55" stroke="#555" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
