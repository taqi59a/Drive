<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#4a7c59"/>
  <!-- Road -->
  <rect x="0" y="60" width="300" height="100" fill="#777"/>
  <line x1="0" y1="110" x2="300" y2="110" stroke="white" stroke-width="2" stroke-dasharray="20,10" opacity="0.4"/>
  <!-- Car 1 (blue, facing right, post-collision angled) -->
  <g transform="translate(100,80) rotate(-18)">
    <rect x="-35" y="-14" width="70" height="28" rx="5" fill="#2255aa"/>
    <rect x="-25" y="-20" width="42" height="14" rx="3" fill="#3377cc"/>
    <circle cx="-24" cy="16" r="6" fill="#222"/>
    <circle cx="24" cy="16" r="6" fill="#222"/>
    <!-- Damage -->
    <path d="M30,-14 L45,0 L30,14" stroke="#ffcc00" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Car 2 (red, facing left, post-collision angled) -->
  <g transform="translate(190,110) rotate(15)">
    <rect x="-35" y="-14" width="70" height="28" rx="5" fill="#cc3322"/>
    <rect x="-18" y="-20" width="42" height="14" rx="3" fill="#ee4433"/>
    <circle cx="-24" cy="16" r="6" fill="#222"/>
    <circle cx="24" cy="16" r="6" fill="#222"/>
    <!-- Damage -->
    <path d="M-30,-14 L-45,0 L-30,14" stroke="#ffcc00" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Collision sparks -->
  <g transform="translate(150,100)">
    <line x1="0" y1="0" x2="10" y2="-12" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="14" y2="2" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-10" y2="-10" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-14" y2="4" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="5" y2="14" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Warning triangles -->
  <g transform="translate(42,98)">
    <polygon points="0,-16 14,10 -14,10" fill="#FFD700" stroke="#cc8800" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-family="Arial" font-size="9" fill="#333" font-weight="bold">!</text>
  </g>
  <g transform="translate(258,98)">
    <polygon points="0,-16 14,10 -14,10" fill="#FFD700" stroke="#cc8800" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-family="Arial" font-size="9" fill="#333" font-weight="bold">!</text>
  </g>
  <text x="150" y="192" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Scène d'accident</text>
</svg>
