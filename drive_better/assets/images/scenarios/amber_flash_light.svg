<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#1a1a2e"/>
  <!-- Traffic light housing -->
  <rect x="110" y="20" width="80" height="150" rx="12" fill="#2c2c2c" stroke="#444" stroke-width="2"/>
  <!-- Red light (unlit) -->
  <circle cx="150" cy="55" r="22" fill="#3d1a1a"/>
  <!-- Amber light (LIT) -->
  <circle cx="150" cy="105" r="22" fill="#f39c12"/>
  <!-- Glow effect for amber -->
  <circle cx="150" cy="105" r="22" fill="url(#amberGlow)" opacity="0.6"/>
  <defs>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#f39c12" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Amber inner highlight -->
  <circle cx="143" cy="98" r="8" fill="#ffe066" opacity="0.5"/>
  <!-- Green light (unlit) -->
  <circle cx="150" cy="155" r="22" fill="#1a3d1a"/>
  <!-- Flash lines radiating from amber -->
  <line x1="150" y1="75" x2="150" y2="62" stroke="#f39c12" stroke-width="2.5" opacity="0.8"/>
  <line x1="150" y1="135" x2="150" y2="148" stroke="#f39c12" stroke-width="2.5" opacity="0.8"/>
  <line x1="120" y1="105" x2="108" y2="105" stroke="#f39c12" stroke-width="2.5" opacity="0.8"/>
  <line x1="180" y1="105" x2="192" y2="105" stroke="#f39c12" stroke-width="2.5" opacity="0.8"/>
  <line x1="129" y1="84" x2="120" y2="75" stroke="#f39c12" stroke-width="2" opacity="0.7"/>
  <line x1="171" y1="84" x2="180" y2="75" stroke="#f39c12" stroke-width="2" opacity="0.7"/>
  <line x1="129" y1="126" x2="120" y2="135" stroke="#f39c12" stroke-width="2" opacity="0.7"/>
  <line x1="171" y1="126" x2="180" y2="135" stroke="#f39c12" stroke-width="2" opacity="0.7"/>
  <!-- Post -->
  <rect x="146" y="170" width="8" height="25" fill="#555"/>
  <!-- Label -->
  <text x="150" y="198" text-anchor="middle" font-family="Arial" font-size="11" fill="#f39c12" font-weight="bold">AMBER FLASHING LIGHT</text>
</svg>