<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#f0f4f8"/>
  <!-- Roundabout road ring -->
  <circle cx="150" cy="105" r="70" fill="#777"/>
  <circle cx="150" cy="105" r="50" fill="#f0f4f8"/>
  <!-- Center island -->
  <circle cx="150" cy="105" r="30" fill="#5a8a3c"/>
  <!-- Roundabout arrows (circulation) -->
  <path d="M150,78 A27,27 0 1,1 123,105" fill="none" stroke="white" stroke-width="3" stroke-dasharray="8,5"/>
  <polygon points="118,100 123,112 130,102" fill="white"/>
  <!-- Exit road (right/east) -->
  <rect x="218" y="90" width="55" height="30" fill="#777"/>
  <line x1="218" y1="105" x2="273" y2="105" stroke="white" stroke-width="2" stroke-dasharray="10,8"/>
  <!-- Car on roundabout approaching exit -->
  <g transform="translate(185,88)">
    <rect x="-18" y="-12" width="36" height="22" rx="5" fill="#3a7bd5"/>
    <rect x="-12" y="-20" width="24" height="14" rx="3" fill="#3a7bd5"/>
    <rect x="-10" y="-18" width="9" height="10" rx="2" fill="#a8d8f0"/>
    <rect x="2" y="-18" width="9" height="10" rx="2" fill="#a8d8f0"/>
    <!-- Right indicator (amber) -->
    <rect x="14" y="-6" width="7" height="5" rx="1" fill="#f39c12"/>
    <rect x="14" y="4" width="7" height="5" rx="1" fill="#f39c12"/>
  </g>
  <!-- Exit arrow -->
  <path d="M205,90 Q218,80 230,88" fill="none" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/>
  <polygon points="225,82 232,90 222,91" fill="#e74c3c"/>
  <!-- Label -->
  <text x="150" y="192" text-anchor="middle" font-family="Arial" font-size="11" fill="#2c3e50" font-weight="bold">ROUNDABOUT EXIT SIGNAL</text>
</svg>