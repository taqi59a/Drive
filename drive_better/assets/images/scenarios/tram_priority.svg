<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#f0f4f8"/>
  <!-- Tram tracks -->
  <line x1="0" y1="135" x2="300" y2="135" stroke="#888" stroke-width="3"/>
  <line x1="0" y1="145" x2="300" y2="145" stroke="#888" stroke-width="3"/>
  <!-- Cross ties -->
  <line x1="40" y1="132" x2="40" y2="148" stroke="#888" stroke-width="2"/>
  <line x1="80" y1="132" x2="80" y2="148" stroke="#888" stroke-width="2"/>
  <line x1="120" y1="132" x2="120" y2="148" stroke="#888" stroke-width="2"/>
  <line x1="160" y1="132" x2="160" y2="148" stroke="#888" stroke-width="2"/>
  <line x1="200" y1="132" x2="200" y2="148" stroke="#888" stroke-width="2"/>
  <line x1="240" y1="132" x2="240" y2="148" stroke="#888" stroke-width="2"/>
  <!-- Tram body -->
  <rect x="30" y="70" width="130" height="65" rx="6" fill="#e74c3c"/>
  <rect x="35" y="60" width="120" height="20" rx="4" fill="#c0392b"/>
  <!-- Tram windows -->
  <rect x="40" y="75" width="25" height="28" rx="3" fill="#a8d8f0"/>
  <rect x="72" y="75" width="25" height="28" rx="3" fill="#a8d8f0"/>
  <rect x="104" y="75" width="25" height="28" rx="3" fill="#a8d8f0"/>
  <rect x="136" y="75" width="18" height="28" rx="3" fill="#a8d8f0"/>
  <!-- Tram door -->
  <rect x="72" y="108" width="25" height="27" rx="2" fill="#c0392b" stroke="#fff" stroke-width="1"/>
  <!-- Tram wheels -->
  <circle cx="65" cy="137" r="6" fill="#555"/>
  <circle cx="120" cy="137" r="6" fill="#555"/>
  <!-- Overhead wire -->
  <line x1="0" y1="50" x2="300" y2="50" stroke="#555" stroke-width="1.5"/>
  <line x1="85" y1="50" x2="85" y2="62" stroke="#555" stroke-width="1.5"/>
  <!-- Small car yielding -->
  <rect x="210" y="105" width="60" height="30" rx="6" fill="#3a7bd5"/>
  <rect x="220" y="92" width="38" height="20" rx="4" fill="#3a7bd5"/>
  <rect x="223" y="95" width="14" height="14" rx="2" fill="#a8d8f0"/>
  <rect x="240" y="95" width="14" height="14" rx="2" fill="#a8d8f0"/>
  <circle cx="222" cy="137" r="8" fill="#222"/>
  <circle cx="258" cy="137" r="8" fill="#222"/>
  <!-- Yield arrow from car to tram -->
  <path d="M210,120 L175,120" fill="none" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/>
  <polygon points="175,114 162,120 175,126" fill="#e74c3c"/>
  <!-- YIELD text -->
  <text x="190" y="113" text-anchor="middle" font-family="Arial" font-size="9" fill="#e74c3c" font-weight="bold">YIELD</text>
  <text x="150" y="192" text-anchor="middle" font-family="Arial" font-size="11" fill="#2c3e50" font-weight="bold">TRAM PRIORITY</text>
</svg>