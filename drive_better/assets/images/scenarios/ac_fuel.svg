<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#f0f8ff"/>
  <text x="150" y="16" text-anchor="middle" font-family="Arial" font-size="12" fill="#2c3e50" font-weight="bold">A/C INCREASES FUEL CONSUMPTION</text>
  <!-- Snowflake (AC symbol) -->
  <g transform="translate(75,100)">
    <circle cx="0" cy="0" r="6" fill="#3498db"/>
    <line x1="0" y1="-38" x2="0" y2="38" stroke="#3498db" stroke-width="4" stroke-linecap="round"/>
    <line x1="-33" y1="-19" x2="33" y2="19" stroke="#3498db" stroke-width="4" stroke-linecap="round"/>
    <line x1="-33" y1="19" x2="33" y2="-19" stroke="#3498db" stroke-width="4" stroke-linecap="round"/>
    <line x1="-8" y1="-28" x2="0" y2="-38" stroke="#3498db" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="-28" x2="0" y2="-38" stroke="#3498db" stroke-width="3" stroke-linecap="round"/>
    <line x1="-8" y1="28" x2="0" y2="38" stroke="#3498db" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="28" x2="0" y2="38" stroke="#3498db" stroke-width="3" stroke-linecap="round"/>
    <line x1="-38" y1="-8" x2="-28" y2="0" stroke="#3498db" stroke-width="3" stroke-linecap="round"/>
    <line x1="-38" y1="8" x2="-28" y2="0" stroke="#3498db" stroke-width="3" stroke-linecap="round"/>
    <line x1="38" y1="-8" x2="28" y2="0" stroke="#3498db" stroke-width="3" stroke-linecap="round"/>
    <line x1="38" y1="8" x2="28" y2="0" stroke="#3498db" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="58" text-anchor="middle" font-family="Arial" font-size="11" fill="#3498db" font-weight="bold">A/C ON</text>
  </g>
  <!-- Arrow -->
  <text x="135" y="108" text-anchor="middle" font-family="Arial" font-size="30" fill="#555">→</text>
  <!-- Fuel gauge -->
  <g transform="translate(210,100)">
    <rect x="-50" y="-45" width="100" height="90" rx="8" fill="white" stroke="#ccc" stroke-width="2"/>
    <path d="M-35,15 A40,40 0 0,1 35,15" fill="none" stroke="#eee" stroke-width="10"/>
    <path d="M-35,15 A40,40 0 0,1 10,-30" fill="none" stroke="#27ae60" stroke-width="10" stroke-linecap="round"/>
    <line x1="0" y1="5" x2="25" y2="-22" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="5" r="4" fill="#555"/>
    <text x="-38" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="#27ae60">F</text>
    <text x="28" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="#e74c3c">E</text>
    <text x="0" y="-30" text-anchor="middle" font-family="Arial" font-size="14" fill="#e74c3c">↑</text>
    <text x="0" y="48" text-anchor="middle" font-family="Arial" font-size="9" fill="#e74c3c">+10-15%</text>
  </g>
  <text x="150" y="185" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Switch off A/C at lower speeds to save fuel</text>
</svg>
