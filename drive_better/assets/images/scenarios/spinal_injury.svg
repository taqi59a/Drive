<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#fff8f0"/>
  <text x="150" y="15" text-anchor="middle" font-family="Arial" font-size="11" fill="#2c3e50" font-weight="bold">SUSPECTED SPINAL INJURY — DO NOT MOVE</text>
  <!-- Ground -->
  <line x1="20" y1="148" x2="280" y2="148" stroke="#ccc" stroke-width="2"/>
  <!-- Person lying flat on back -->
  <!-- Body -->
  <rect x="55" y="118" width="170" height="28" rx="14" fill="#f5cba7"/>
  <!-- Head -->
  <circle cx="55" cy="132" r="18" fill="#f5cba7"/>
  <!-- Hair -->
  <path d="M40,120 Q55,112 70,120 Q68,115 55,113 Q42,115 40,120" fill="#8B4513"/>
  <!-- Spine highlight (injury area) -->
  <line x1="70" y1="132" x2="210" y2="132" stroke="#e74c3c" stroke-width="3" stroke-dasharray="6,3" opacity="0.6"/>
  <rect x="120" y="125" width="40" height="14" rx="4" fill="#e74c3c" opacity="0.25"/>
  <!-- Arms at sides -->
  <rect x="80" y="144" width="60" height="10" rx="5" fill="#f5cba7"/>
  <rect x="160" y="144" width="60" height="10" rx="5" fill="#f5cba7"/>
  <!-- Legs -->
  <rect x="110" y="144" width="25" height="38" rx="10" fill="#6c8ebf"/>
  <rect x="145" y="144" width="25" height="38" rx="10" fill="#6c8ebf"/>
  <!-- Neck collar indicator -->
  <rect x="48" y="140" width="30" height="12" rx="4" fill="#f1c40f" stroke="#e67e22" stroke-width="1.5"/>
  <text x="63" y="150" text-anchor="middle" font-family="Arial" font-size="6" fill="#2c3e50" font-weight="bold">COLLAR</text>
  <!-- Crossed-out movement arrows -->
  <!-- Left arrow (crossed) -->
  <g opacity="0.85">
    <line x1="22" y1="100" x2="48" y2="125" stroke="#3498db" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="42,119 50,128 38,128" fill="#3498db"/>
    <line x1="18" y1="95" x2="52" y2="130" stroke="#e74c3c" stroke-width="4" stroke-linecap="round"/>
    <line x1="52" y1="95" x2="18" y2="130" stroke="#e74c3c" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Right arrow (crossed) -->
  <g opacity="0.85">
    <line x1="252" y1="100" x2="228" y2="125" stroke="#3498db" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="235,119 226,128 238,128" fill="#3498db"/>
    <line x1="248" y1="95" x2="214" y2="130" stroke="#e74c3c" stroke-width="4" stroke-linecap="round"/>
    <line x1="214" y1="95" x2="248" y2="130" stroke="#e74c3c" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Warning triangle -->
  <polygon points="150,60 170,95 130,95" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="150" y="87" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#2c3e50">!</text>
  <text x="150" y="175" text-anchor="middle" font-family="Arial" font-size="10" fill="#e74c3c" font-weight="bold">KEEP STILL · SUPPORT HEAD · CALL 112</text>
</svg>