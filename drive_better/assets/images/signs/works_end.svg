<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer rectangle border -->
  <rect x="5" y="50" width="190" height="100" rx="5" fill="white" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Diagonal black/yellow stripes (left panel) -->
  <clipPath id="left-panel">
    <rect x="8" y="53" width="80" height="94" rx="3"/>
  </clipPath>
  <rect x="8" y="53" width="80" height="94" rx="3" fill="#FFD700"/>
  <g clip-path="url(#left-panel)">
    <line x1="-10" y1="53" x2="90" y2="147" stroke="#1a1a1a" stroke-width="14"/>
    <line x1="10" y1="53" x2="110" y2="147" stroke="#1a1a1a" stroke-width="14"/>
    <line x1="30" y1="53" x2="130" y2="147" stroke="#1a1a1a" stroke-width="14"/>
    <line x1="50" y1="53" x2="150" y2="147" stroke="#1a1a1a" stroke-width="14"/>
    <line x1="70" y1="53" x2="170" y2="147" stroke="#1a1a1a" stroke-width="14"/>
  </g>
  <!-- White right panel with END text -->
  <rect x="90" y="53" width="107" height="94" rx="0" fill="white"/>
  <text x="143" y="110" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="36" fill="#1a1a1a" text-anchor="middle">END</text>
  <!-- Divider line -->
  <line x1="90" y1="53" x2="90" y2="147" stroke="#1a1a1a" stroke-width="2"/>
</svg>
